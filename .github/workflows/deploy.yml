name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # need the full history to count commits for the build number

      # Stamp the build number — just the commit count, so the badge reads "v128"
      # and is easy to say out loud when reporting a bug. Runs on every push.
      - name: Stamp version
        run: |
          echo "window.APP_VERSION = \"$(git rev-list --count HEAD)\";" > version.js
          # bust the cached version.js whenever the HTML itself is fresh
          sed -i "s|<script src=\"version.js[^\"]*\">|<script src=\"version.js?v=${GITHUB_SHA::7}\">|" index.html
          echo "Stamped: $(cat version.js)"
          grep -o '<script src="version.js[^"]*">' index.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
