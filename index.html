<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="H+A Workouts" />
<meta name="theme-color" content="#0e0f13" />
<link rel="manifest" href="manifest.json" />
<title>Hyebin & Andrew Workouts</title>
<style>
  :root{
    --bg:#f4f6fa; --card:#ffffff; --card2:#eef1f6; --line:#e2e6ee;
    --txt:#141821; --muted:#697086; --accent:#2f7bff; --accent2:#1b5fe0;
    --good:#15b877; --warn:#e6960a; --bad:#e5484d;
    --bgblur:244,246,250; --shadow:0 1px 3px rgba(20,30,60,.07);
    --safe-top:env(safe-area-inset-top); --safe-bot:env(safe-area-inset-bottom);
  }
  body.dark{
    --bg:#0e0f13; --card:#171a21; --card2:#1f232c; --line:#2a2f3a;
    --txt:#f2f4f8; --muted:#8b93a5; --good:#27c281; --warn:#ffb020; --bad:#ff5d5d;
    --bgblur:14,15,19; --shadow:0 8px 24px rgba(0,0,0,.4);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--txt);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
    overscroll-behavior-y:none;-webkit-text-size-adjust:100%}
  body{padding-bottom:calc(64px + var(--safe-bot))}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  input,select{font-family:inherit}
  .app{max-width:560px;margin:0 auto}

  /* ===== Top bar ===== */
  header{position:sticky;top:0;z-index:50;background:rgba(var(--bgblur),.9);
    backdrop-filter:saturate(140%) blur(12px);border-bottom:1px solid var(--line);
    padding:calc(var(--safe-top) + 8px) 14px 8px}
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .brand{font-weight:800;font-size:20px;letter-spacing:-.3px}
  .brand span{color:var(--accent)}
  .profiles{display:flex;gap:7px;align-items:center;overflow-x:auto;padding:10px 0 2px;scrollbar-width:none}
  .profiles::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto;display:flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;
    background:var(--card);border:1px solid var(--line);font-size:13px;font-weight:600;color:var(--muted)}
  .chip.active{color:#fff;border-color:transparent}
  .chip .dot{width:9px;height:9px;border-radius:50%}
  .chip.add{color:var(--accent);font-weight:700}
  #partner{margin-top:8px}
  .partner{display:flex;align-items:center;gap:7px;background:var(--card);border:1px solid var(--line);
    border-radius:12px;padding:8px 11px;margin-bottom:4px;box-shadow:var(--shadow)}
  .partner .plive{width:8px;height:8px;border-radius:50%;flex:0 0 auto;animation:pulse 1.6s ease-in-out infinite}
  @keyframes pulse{50%{opacity:.3}}
  .partner .pname{font-weight:800;font-size:13px;flex:0 0 auto}
  .partner .pinfo{color:var(--muted);font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1 1 auto}
  .partner .prest{color:var(--accent);font-weight:800;flex:0 0 auto;font-variant-numeric:tabular-nums}

  /* ===== Views ===== */
  main{padding:14px}
  .h1{font-size:26px;font-weight:800;letter-spacing:-.5px;margin:4px 2px 14px}
  .sub{color:var(--muted);font-size:13px}
  .row{display:flex;align-items:center;gap:10px}
  .between{justify-content:space-between}

  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;
    background:var(--accent);color:#fff;font-weight:700;font-size:16px;
    padding:14px 18px;border-radius:14px;width:100%}
  .btn:active{background:var(--accent2)}
  .btn.sec{background:var(--card2);color:var(--txt);border:1px solid var(--line)}
  .btn.ghost{background:transparent;color:var(--accent);font-weight:700}
  .btn.danger{background:transparent;color:var(--bad);border:1px solid #4a2730}
  .btn.sm{padding:9px 12px;font-size:14px;width:auto;border-radius:11px}

  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:var(--shadow)}
  .card.tap:active{background:var(--card2)}
  .wname{font-size:18px;font-weight:700}
  .meta{color:var(--muted);font-size:13px;margin-top:3px}
  .pill{display:inline-block;background:var(--card2);border:1px solid var(--line);
    color:var(--muted);font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;margin:3px 5px 0 0}

  .empty{text-align:center;color:var(--muted);padding:50px 20px}
  .empty .big{font-size:46px;margin-bottom:8px}

  /* ===== Active workout ===== */
  .stickybar{position:sticky;top:0;z-index:40;background:var(--card);border:1px solid var(--line);
    border-radius:14px;padding:10px 12px;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between}
  .timerbig{font-variant-numeric:tabular-nums;font-weight:800;font-size:20px}
  .exhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
  .exname{font-weight:700;font-size:16px}
  .exsub{color:var(--accent);font-size:12.5px;font-weight:600;margin-top:1px}
  .setgrid{width:100%;border-collapse:collapse;margin-top:6px}
  .setgrid th{color:var(--muted);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;
    text-align:center;padding:4px 2px}
  .setgrid td{text-align:center;padding:4px 2px}
  .setgrid th.l,.setgrid td.l{text-align:left}
  .setno{width:34px;font-weight:700;color:var(--muted)}
  .prevcell{color:var(--muted);font-size:13px;white-space:nowrap}
  .inp{width:62px;background:var(--card2);border:1px solid var(--line);color:var(--txt);
    text-align:center;font-size:16px;font-weight:600;padding:9px 4px;border-radius:10px}
  .inp.rpe{width:52px}
  .inp:focus{outline:none;border-color:var(--accent)}
  .inp::placeholder{color:var(--muted);opacity:.65;font-weight:600}
  tr.done .inp{background:rgba(39,194,129,.12);border-color:rgba(39,194,129,.45)}
  tr.wu .setno{color:var(--warn);font-weight:800;font-size:11px}
  tr.wu .inp{opacity:.92}
  .recnote{display:flex;gap:6px;align-items:flex-start;color:var(--muted);font-size:12px;font-weight:600;
    margin:8px 2px 2px;line-height:1.45}
  .recnote b{color:var(--accent)}
  .check{width:34px;height:34px;border-radius:10px;background:var(--card2);border:1px solid var(--line);
    font-size:16px;display:inline-flex;align-items:center;justify-content:center}
  tr.done .check{background:var(--good);border-color:var(--good);color:#062}
  .howbtn{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;color:#ff3b30;
    background:var(--card2);border:1px solid var(--line);border-radius:9px;padding:6px 9px;white-space:nowrap}
  .howbtn:active{background:var(--line)}
  .rpeq{display:inline-flex;align-items:center;justify-content:center;width:15px;height:15px;border-radius:50%;
    border:1px solid var(--muted);color:var(--muted);font-size:10px;font-weight:800;vertical-align:middle}
  .rpetable{width:100%;border-collapse:collapse;margin:2px 0 14px}
  .rpetable td{padding:8px 6px;border-top:1px solid var(--line);vertical-align:top;font-size:14px}
  .rpetable td.n{width:46px;font-weight:800;color:var(--accent);text-align:center}
  .guide{display:flex;align-items:center;gap:8px;margin-top:10px;padding:10px 11px;border-radius:11px;
    background:rgba(47,123,255,.09);border:1px solid rgba(47,123,255,.28);color:var(--txt);font-size:13px;font-weight:600}
  .guide .ic{font-size:14px;flex:0 0 auto}
  .guide.empty{color:var(--accent);background:var(--card2);border-style:dashed;border-color:var(--line);font-weight:700}
  .guide .edit{margin-left:auto;color:var(--muted);font-size:11px;font-weight:700;flex:0 0 auto}
  .gline{display:flex;align-items:center;gap:10px;margin-bottom:14px}
  .gline .lbl{width:84px;color:var(--muted);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.4px}
  .stepper{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:11px;overflow:hidden;background:var(--card2)}
  .stepper button{width:42px;height:44px;font-size:22px;font-weight:700;color:var(--accent);background:transparent}
  .stepper button:active{background:var(--line)}
  .stepin{width:52px;height:44px;border:none;background:transparent;text-align:center;font-size:18px;font-weight:800;color:var(--txt)}
  .stepin:focus{outline:none}
  .rangeto{color:var(--muted);font-weight:700;margin:0 3px}
  textarea.text{width:100%;min-height:60px;resize:vertical;font-family:inherit;background:var(--card2);
    border:1px solid var(--line);color:var(--txt);font-size:16px;padding:12px;border-radius:12px}
  textarea.text:focus{outline:none;border-color:var(--accent)}
  .delset{color:var(--muted);font-size:18px;width:24px}
  .addset{color:var(--accent);font-weight:700;font-size:14px;padding:9px;width:100%;
    background:var(--card2);border:1px dashed var(--line);border-radius:11px;margin-top:8px}
  .cardfoot{display:flex;gap:8px;align-items:stretch}
  .cardfoot .addset{flex:1}
  .platebtn{color:var(--muted);font-weight:700;font-size:14px;padding:9px 12px;white-space:nowrap;
    background:var(--card2);border:1px dashed var(--line);border-radius:11px;margin-top:8px}
  .platebtn:active{background:var(--line)}

  /* ===== Plate calculator ===== */
  .pcbar{display:flex;align-items:center;justify-content:center;gap:3px;flex-wrap:wrap;
    background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:14px 10px;margin-bottom:12px}
  .pcsleeve{width:16px;height:8px;border-radius:3px;background:var(--muted);opacity:.55}
  .pcplate{display:inline-flex;align-items:center;justify-content:center;min-width:34px;
    color:#fff;font-weight:800;font-size:13px;border-radius:5px;padding:0 6px}
  .pcnone{color:var(--muted);font-weight:700;font-size:14px}
  .pcline{text-align:center;font-weight:800;font-size:15px;margin:-4px 0 12px}
  .pcline.warn{color:var(--warn)}
  .pcsub{text-align:center;color:var(--muted);font-size:13px;font-weight:600;margin:-8px 0 14px;line-height:1.5}
  .pcw{display:flex;align-items:center;gap:10px;margin-bottom:14px}
  .pcw input{flex:1;min-width:0;background:var(--card2);border:1px solid var(--line);color:var(--txt);
    text-align:center;font-size:26px;font-weight:800;padding:12px 4px;border-radius:12px}
  .pcw input:focus{outline:none;border-color:var(--accent)}
  .pcw button{width:52px;height:52px;border-radius:12px;background:var(--card2);border:1px solid var(--line);
    color:var(--txt);font-size:20px;font-weight:800;flex:none}
  .pcw button:active{background:var(--line)}

  /* ===== Supersets ===== */
  .sswrap{border:1px solid rgba(47,123,255,.45);background:rgba(47,123,255,.05);
    border-radius:18px;padding:8px;margin-bottom:12px}
  .sswrap .card{margin-bottom:8px;box-shadow:none}
  .sswrap .card:last-child{margin-bottom:0}
  .sslabel{display:flex;align-items:center;gap:6px;color:var(--accent);font-size:11.5px;font-weight:800;
    text-transform:uppercase;letter-spacing:.4px;padding:3px 7px 9px}
  .sslabel .r{margin-left:auto;text-transform:none;letter-spacing:0;color:var(--muted);font-weight:600;font-size:11.5px}
  .ssidx{display:inline-flex;align-items:center;justify-content:center;height:19px;padding:0 6px;
    border-radius:6px;background:var(--accent);color:#fff;font-size:11px;font-weight:800;
    margin-right:6px;vertical-align:2px}
  .restnote{background:var(--accent);color:#fff;font-size:12.5px;font-weight:700;
    border-radius:11px 11px 0 0;padding:6px 12px 10px;margin-bottom:-6px;opacity:.92}

  /* ===== Rest timer ===== */
  #rest{position:fixed;left:0;right:0;bottom:calc(64px + var(--safe-bot));z-index:60;display:none}
  #rest .inner{max-width:560px;margin:0 auto;padding:0 12px}
  .restbar{background:var(--accent);color:#fff;border-radius:14px;padding:10px 12px;
    display:flex;align-items:center;justify-content:space-between;box-shadow:0 8px 24px rgba(0,0,0,.4)}
  .restbar.ring{animation:flash .5s ease-in-out 3}
  @keyframes flash{50%{background:var(--good)}}
  .restctl{display:flex;align-items:center;gap:6px}
  .restctl button{background:rgba(255,255,255,.18);color:#fff;font-weight:700;border-radius:9px;padding:7px 10px;font-size:13px}
  .resttime{font-variant-numeric:tabular-nums;font-weight:800;font-size:22px;min-width:64px;text-align:center}

  /* ===== Bottom nav ===== */
  nav{position:fixed;left:0;right:0;bottom:0;z-index:55;background:rgba(var(--bgblur),.95);
    backdrop-filter:blur(12px);border-top:1px solid var(--line);
    padding-bottom:var(--safe-bot)}
  .navinner{max-width:560px;margin:0 auto;display:flex}
  .navbtn{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;
    padding:9px 0 7px;color:var(--muted);font-size:11px;font-weight:600}
  .navbtn .ic{font-size:21px;line-height:1}
  .navbtn.active{color:var(--accent)}

  /* ===== Modal ===== */
  .overlay{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;
    justify-content:center;padding:0}
  .sheet{background:var(--card);width:100%;max-width:560px;border-radius:20px 20px 0 0;
    border-top:1px solid var(--line);padding:16px 16px calc(20px + var(--safe-bot));max-height:88vh;overflow:auto;
    animation:slideup .22s ease}
  @keyframes slideup{from{transform:translateY(100%)}}
  .sheet h3{margin:2px 0 14px;font-size:19px;font-weight:800}
  /* hold-to-confirm: discarding a live session should never be one stray tap */
  .holdbtn{position:relative;overflow:hidden;width:100%;padding:15px;border-radius:14px;
    font-size:16px;font-weight:800;background:var(--card2);color:var(--bad);
    border:1px solid #4a2730;-webkit-user-select:none;user-select:none;
    -webkit-touch-callout:none;touch-action:manipulation}
  .holdbtn .fill{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--bad);opacity:.9}
  .holdbtn.arm .fill{width:100%;transition:width 1.1s linear}
  .holdbtn .lbl{position:relative}
  .holdbtn.arm .lbl{color:#fff}
  .holdhint{text-align:center;color:var(--muted);font-size:12px;font-weight:700;margin-top:9px}
  .quitlink{display:block;width:100%;margin-top:18px;padding:10px;background:transparent;
    color:var(--muted);font-size:13px;font-weight:700;text-align:center}
  .field{margin-bottom:14px}
  .field label{display:block;color:var(--muted);font-size:12px;font-weight:700;text-transform:uppercase;
    letter-spacing:.4px;margin-bottom:7px}
  .field input.text{width:100%;background:var(--card2);border:1px solid var(--line);color:var(--txt);
    font-size:17px;padding:13px;border-radius:12px}
  .field input.text:focus{outline:none;border-color:var(--accent)}
  .opts{display:flex;flex-wrap:wrap;gap:8px}
  .opt{padding:10px 14px;border-radius:11px;background:var(--card2);border:1px solid var(--line);
    font-weight:600;font-size:14px;color:var(--muted)}
  .opt.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .liblist{margin:0 0 4px}
  .libitem{display:flex;align-items:center;justify-content:space-between;padding:13px 12px;border-radius:12px;
    background:var(--card2);border:1px solid var(--line);margin-bottom:8px}
  .libitem:active{border-color:var(--accent)}
  .libitem.on{border-color:var(--accent);background:rgba(47,123,255,.10)}
  .libitem .nm{font-weight:600}
  .libitem .eq{color:var(--muted);font-size:12px;margin-top:2px}
  .divider{height:1px;background:var(--line);margin:14px 0}
  .muted{color:var(--muted)}
  .right{margin-left:auto}

  /* ===== Login gate ===== */
  #gate{display:none;position:fixed;inset:0;z-index:90;background:var(--bg);
    align-items:center;justify-content:center;padding:24px calc(24px + env(safe-area-inset-right)) 24px calc(24px + env(safe-area-inset-left))}
  .gatecard{width:100%;max-width:420px;text-align:center}
  .gatebrand{font-size:30px;font-weight:800;letter-spacing:-.5px}
  .gatebrand span{color:var(--accent)}
  .gatesub{color:var(--muted);font-size:16px;margin:8px 0 28px;font-weight:600}
  .gatebtns{display:flex;flex-direction:column;gap:14px}
  .gatebtn{display:flex;align-items:center;justify-content:center;gap:12px;padding:22px;border-radius:18px;
    background:var(--card);border:2px solid var(--pc,var(--line));color:var(--txt);font-size:22px;font-weight:800;box-shadow:var(--shadow)}
  .gatebtn:active{background:var(--card2)}
  .gatebtn .gdot{width:14px;height:14px;border-radius:50%;background:var(--pc,var(--muted))}
  .gateadd{margin-top:22px;color:var(--accent);font-weight:700;font-size:15px}
  .joinbtn{flex:0 0 auto;font-size:12px;font-weight:800;color:#fff;background:var(--accent);
    border-radius:9px;padding:6px 11px}
  .joinbtn:active{background:var(--accent2)}
  .prbadge{display:inline-block;background:linear-gradient(135deg,#ffb020,#ff8a00);color:#3a2400;
    font-size:11px;font-weight:800;padding:2px 8px;border-radius:999px;margin-left:7px;vertical-align:middle}
  .prline{color:var(--warn);font-size:12px;font-weight:700;margin-top:6px}
  .warnbox{background:rgba(230,150,10,.12);border:1px solid rgba(230,150,10,.45);border-radius:12px;
    padding:11px 12px;margin-bottom:16px;font-size:12.5px;font-weight:600;line-height:1.55;color:var(--txt)}
  .draghandle{display:inline-block;color:var(--muted);font-size:16px;line-height:1;margin-right:7px;
    cursor:grab;touch-action:none;-webkit-user-select:none;user-select:none;vertical-align:1px;padding:2px 3px}
  .sidetag{display:inline-block;background:var(--card2);border:1px solid var(--line);color:var(--muted);
    font-size:10.5px;font-weight:800;padding:1px 6px;border-radius:999px;margin-left:7px;vertical-align:2px}
  .exrow.dragging{opacity:.55;transform:scale(.98);box-shadow:0 10px 26px rgba(0,0,0,.28)}
  .exrow.dropzone{outline:2px dashed var(--accent);outline-offset:2px}
  /* ===== Progress / analysis battery ===== */
  .anacard{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:13px 14px;
    margin-bottom:12px;box-shadow:var(--shadow)}
  .anahead{display:flex;align-items:center;gap:8px}
  .anastep{color:var(--accent);font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.5px}
  .anafoot{color:var(--muted);font-size:12.5px;font-weight:600;line-height:1.5;margin-top:6px}
  .conf{font-size:11px;font-weight:800;padding:2px 7px;border-radius:999px;display:inline-block;margin-top:3px}
  .conf.ok{background:rgba(21,184,119,.15);color:var(--good)}
  .conf.mid{background:rgba(230,150,10,.15);color:var(--warn)}
  .conf.low{background:var(--card2);color:var(--muted)}
  .ctlbtn{margin-left:auto;font-size:12px;font-weight:800;padding:4px 11px;border-radius:999px;
    background:var(--card2);color:var(--muted);border:1px solid var(--line)}
  .ctlbtn.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  #updbar{position:fixed;left:0;right:0;top:0;z-index:120;display:none;background:var(--good);color:#053;
    padding:calc(env(safe-area-inset-top) + 10px) 14px 12px;text-align:center;font-weight:800;font-size:15px;
    box-shadow:0 4px 16px rgba(0,0,0,.25)}
  #updbar span{text-decoration:underline}
  .editbtn{color:var(--accent);font-weight:700;font-size:13px;padding:8px 12px;background:var(--card2);
    border:1px solid var(--line);border-radius:10px}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="topbar">
      <div class="brand" onclick="openGate()" title="Switch user">Hyebin <span>&amp;</span> Andrew</div>
      <button class="btn ghost sm" id="themeBtn" style="width:auto"></button>
    </div>
    <div class="profiles" id="profiles"></div>
    <div id="partner"></div>
  </header>
  <main id="view"></main>
  <div id="ver" style="text-align:center;color:var(--muted);font-size:11px;padding:8px 0 96px;line-height:1.6"></div>
</div>

<div id="rest"><div class="inner">
  <div class="restnote" id="restNote" style="display:none"></div>
  <div class="restbar" id="restbar">
  <div class="restctl">
    <button data-rest="-15">−15</button>
    <button data-rest="+15">+15</button>
  </div>
  <div class="resttime" id="restTime">0:00</div>

<script>
"use strict";
/* ============================================================
   LiftLog — a Strong-style workout tracker (single file, localStorage)
   ============================================================ */
const STORE_KEY = "liftlog.v1";
const EQUIPMENT = ["Barbell","Dumbbell","Machine","Cables","Smith","Bodyweight","Kettlebell","Other"];
const ANGLES = ["None","Flat","Incline","Decline"];
const PROFILE_COLORS = ["#2f7bff","#ff6b9d","#27c281","#ffb020","#a16bff","#ff7a45"];

/* ---------- state ---------- */
let S = load();
let route = { tab:"workouts", view:"list", id:null };  // view: list | active | session
// Where you were on each tab, so hopping to History and back doesn't dump you out
// of the workout you're in the middle of. Also remembers scroll for that tab.
const tabMem = { workouts:{view:"list",id:null,scroll:0}, history:{view:"list",id:null,scroll:0}, progress:{view:"list",id:null,scroll:0} };
let modal = null;
let beepCtx = null;

function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }

function load(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  // stable ids so every device shares the SAME two profiles (no duplicates when syncing)
  return {
    units:"lb",
    theme:"light",
    profiles:[{id:"hyebin",name:"Hyebin",color:PROFILE_COLORS[1]},{id:"andrew",name:"Andrew",color:PROFILE_COLORS[0]}],
    currentProfileId:"hyebin",
    exercises:[],     // library: {id,name,equipment,angle}
    workouts:[],      // templates: {id,name,exerciseIds:[]}
    sessions:[],      // completed: {id,workoutId,workoutName,profileId,startedAt,endedAt,durationSec,entries:[...]}
    active:null,      // {workoutId,profileId,startedAt,entries:[{exerciseId,sets:[{weight,reps,rpe,done}]}]}
    restDefault:90,
    restSuperset:15,  // shorter rest between the exercises inside a superset (0 = none)
    restAlert:"sound", // device-only: "sound" | "vibrate" | "silent" — how the rest alert fires
    buzzPattern:"double", // device-only: which vibration pattern the rest alert uses
    alertRepeat:3, // device-only: how many times the rest alert fires (nags until you get back)
    notifyRest:true, // device-only: banner when rest ends (needs notification permission)
    lockAudio:true,   // device-only: keep the countdown alive while the phone is locked
    ringOnSilent:false // device-only: opt-in. ON takes exclusive audio (stops music); OFF only ever mixes
  };
}
function save(){ localStorage.setItem(STORE_KEY, JSON.stringify(S)); scheduleCloudPush(); }

/* ============================================================
   CLOUD SYNC (Firebase) — optional, shared across both phones.
   Synced data = profiles + exercise library + templates + sessions.
   Device-only (NOT synced) = theme, current profile, in-progress workout.
   The Firebase module (bottom of file) defines window.cloudPush + calls
   window.onCloudData when remote data arrives. If no config, app stays local.
   ============================================================ */
let applyingRemote=false, cloudTimer=null, lastSync="";
function cloudOn(){ return !!(window.FIREBASE_CONFIG && window.FIREBASE_CONFIG.apiKey); }
function syncedState(){ return {profiles:S.profiles, exercises:S.exercises, workouts:S.workouts, sessions:S.sessions,
  restDefault:S.restDefault, restSuperset:S.restSuperset}; }
function setSync(msg){ lastSync=msg; const s=document.getElementById("syncStat"); if(s) s.textContent=msg; }
function scheduleCloudPush(){
  if(applyingRemote || !window.cloudPush) return;
  if(cloudTimer) clearTimeout(cloudTimer);
  cloudTimer=setTimeout(()=>{
    try{ Promise.resolve(window.cloudPush(syncedState()))
      .then(()=>setSync("✓ synced")).catch(()=>setSync("⚠ will sync when online")); }
    catch(e){ setSync("⚠ offline"); }
  },700);
}
function mergeArrById(localArr, remoteArr){
  const m=new Map((localArr||[]).map(x=>[x.id,x]));
  (remoteArr||[]).forEach(x=>{ if(x&&x.id) m.set(x.id,x); });
  return [...m.values()];
}
/* ---- security: treat all cloud data as untrusted ----

   so validate them at ingest. Anything that doesn't match a safe shape is
   dropped/replaced (text fields are still HTML-escaped at render time). */
const SAFE_ID=/^[A-Za-z0-9_-]{1,64}$/;
const SAFE_HEX=/^#[0-9a-fA-F]{3,8}$/;
function safeId(x){ return (typeof x==="string" && SAFE_ID.test(x)) ? x : null; }
function safeColor(x){ return (typeof x==="string" && SAFE_HEX.test(x)) ? x : "#8b93a5"; }
function sanitizeCloud(r){
  r=r||{};

    profiles: arr(r.profiles).filter(p=>p&&safeId(p.id)).map(p=>({...p, color:safeColor(p.color)})),
    exercises: arr(r.exercises).filter(e=>e&&safeId(e.id)),
    workouts: arr(r.workouts).filter(w=>w&&safeId(w.id))
      .map(w=>({...w, exerciseIds: arr(w.exerciseIds).filter(safeId), ss: safeSsMap(w.ss)})),
    sessions: arr(r.sessions).filter(s=>s&&safeId(s.id))
      .map(s=>({...s, entries: arr(s.entries).filter(en=>en&&safeId(en.exerciseId))
        .map(en=>({...en, ss: safeId(en.ss)}))})),

}
function safeRest(v){ v=Number(v); return (isFinite(v)&&v>=15&&v<=600) ? Math.round(v/5)*5 : null; }
function safeSsRest(v){ v=Number(v); return (isFinite(v)&&v>=0&&v<=300) ? Math.round(v/5)*5 : null; }
// superset grouping travels as {exerciseId: groupId}; both halves are interpolated into
// markup/handlers, so nothing that isn't a plain id survives ingest
function safeSsMap(m){
  if(!m || typeof m!=="object" || Array.isArray(m)) return null;
  const o={};
  Object.keys(m).forEach(k=>{ if(safeId(k) && safeId(m[k])) o[k]=m[k]; });
  return Object.keys(o).length ? o : null;
}
// called by the Firebase module when remote data changes
window.onCloudData=function(remote){
  if(!remote) return;
  remote=sanitizeCloud(remote);
  applyingRemote=true;
  const extra = (S.sessions.length>(remote.sessions||[]).length)
             || (S.workouts.length>(remote.workouts||[]).length)
             || (S.exercises.length>(remote.exercises||[]).length)
             || (S.profiles.length>(remote.profiles||[]).length);
  S.profiles  = mergeArrById(S.profiles,  remote.profiles);
  S.exercises = mergeArrById(S.exercises, remote.exercises);
  S.workouts  = mergeArrById(S.workouts,  remote.workouts);
  S.sessions  = mergeArrById(S.sessions,  remote.sessions);
  if(remote.restDefault!=null) S.restDefault=remote.restDefault;       // shared rest length
  if(remote.restSuperset!=null) S.restSuperset=remote.restSuperset;    // …and superset rest
  dedupeProfiles();   // collapse any duplicate profiles introduced by the merge
  dedupeExercises();  // …and any same-lift-different-spelling exercises
  if(!S.profiles.some(p=>p.id===S.currentProfileId) && S.profiles[0]) S.currentProfileId=S.profiles[0].id;
  localStorage.setItem(STORE_KEY, JSON.stringify(S));
  applyingRemote=false;
  setSync("✓ synced");
  render();
  if(S.active && S.active.joint) applyPlan();  // now that exercises synced, add any joint ones
  // if we held data the cloud didn't have, push our superset so the other phone gets it
  if(extra && window.cloudPush){ try{ window.cloudPush(syncedState()); }catch(e){} }
};
window.onCloudReady=function(){ setSync("✓ cloud connected"); };
window.setSyncErr=function(){ setSync("⚠ offline"); };

/* ---------- helpers ---------- */
function profile(id){ return S.profiles.find(p=>p.id===id); }
function curProfile(){ return profile(S.currentProfileId); }
function exById(id){ return S.exercises.find(e=>e.id===id); }
function workoutById(id){ return S.workouts.find(w=>w.id===id); }
// collapse duplicate profiles (same name) that older devices created before stable ids;
// keeps the canonical stable id and remaps any history/current-profile to it.
function dedupeProfiles(){
  const groups={};
  S.profiles.forEach(p=>{ const k=(p.name||"").trim().toLowerCase(); (groups[k]=groups[k]||[]).push(p); });
  const remap={}, keep=[];
  Object.keys(groups).forEach(k=>{
    const g=groups[k];
    const winner=g.find(p=>p.id==="hyebin"||p.id==="andrew") || g[0];
    keep.push(winner);
    g.forEach(p=>{ if(p.id!==winner.id) remap[p.id]=winner.id; });
  });
  if(!Object.keys(remap).length) return false;
  S.profiles=keep;
  S.sessions.forEach(s=>{ if(remap[s.profileId]) s.profileId=remap[s.profileId]; });
  if(remap[S.currentProfileId]) S.currentProfileId=remap[S.currentProfileId];
  return true;
}

/* ---------- exercise identity ----------
   "bench press", "Bench Press" and "Bench  Presses" are the SAME lift. Everything that
   looks a name up goes through exKey() so the library never grows a second copy.
   Equipment still separates lifts (Barbell vs Dumbbell bench are different), but the
   default angle "None" and "Flat" are treated as the same bucket. */
function exKey(name, equipment, angle){
  const n=String(name||"").toLowerCase()
    .replace(/[^a-z0-9\s]/g," ")            // punctuation/hyphens are noise
    .replace(/\s+/g," ").trim()
    .split(" ")
    .map(w=>{                                // presses→press, flies→fly, curls→curl; press stays press
      if(/(ss|x|z|ch|sh)es$/.test(w)) return w.slice(0,-2);
      if(w.length>3 && /ies$/.test(w)) return w.slice(0,-3)+"y";
      return (w.length>3 && /s$/.test(w) && !/(ss|us|is)$/.test(w)) ? w.slice(0,-1) : w;
    })
    .join("");                               // spaceless, so "pull-down" == "pulldown"
  if(equipment===undefined) return n;
  const a=(angle&&angle!=="None"&&angle!=="Flat")?angle:"Flat";
  return `${n}|${equipment||"Other"}|${a}`;
}
// the exercise this name+equipment+angle already IS, if we have it
function findExercise(name, equipment, angle){
  const k=exKey(name, equipment, angle);
  return S.exercises.find(e=>exKey(e.name,e.equipment,e.angle)===k) || null;
}
// existing spelling for a name we've seen before (any equipment), so casing stays consistent
function canonicalExName(name){
  const k=exKey(name);
  const hit=S.exercises.find(e=>exKey(e.name)===k);
  return hit ? hit.name : titleCaseName(name);
}
function titleCaseName(name){
  const s=String(name||"");
  // ALL CAPS across several words is caps lock, not an acronym — but a lone "RDL" is
  const shouting = s===s.toUpperCase() && (s.match(/[A-Za-z]+/g)||[]).length>1;
  return s.replace(/[A-Za-z][A-Za-z']*/g, w =>
    (!shouting && w.length<=4 && w===w.toUpperCase()) ? w        // RDL, OHP, DB stay shouty
      : w[0].toUpperCase()+w.slice(1).toLowerCase());
}
// how well-formed a name looks — used to pick which spelling survives a merge
function nameScore(n){
  const words=String(n||"").trim().split(/\s+/).filter(Boolean);
  return words.filter(w=>/^[A-Z]/.test(w)).length;
}
/* Collapse library entries that are the same lift under different spellings, remapping
   history, templates and the in-progress workout onto the survivor. Deterministic (same
   winner on both phones) so synced devices converge instead of ping-ponging. */
function dedupeExercises(){
  const groups={};
  S.exercises.forEach(e=>{ const k=exKey(e.name,e.equipment,e.angle); (groups[k]=groups[k]||[]).push(e); });
  const remap={}, keep=[];
  S.exercises.forEach(e=>{
    const g=groups[exKey(e.name,e.equipment,e.angle)];
    if(g.length<2){ keep.push(e); return; }
    if(g.winner===undefined){
      const sorted=g.slice().sort((a,b)=> (nameScore(b.name)-nameScore(a.name)) || String(a.id).localeCompare(String(b.id)));
      g.winner=sorted[0];
      if(!g.winner.goal){ const withGoal=sorted.find(x=>x.goal); if(withGoal) g.winner.goal=withGoal.goal; }
      if(g.winner.assisted==null){ const w=sorted.find(x=>x.assisted!=null); if(w) g.winner.assisted=w.assisted; }
      keep.push(g.winner);
    }
    if(e.id!==g.winner.id) remap[e.id]=g.winner.id;
  });
  if(!Object.keys(remap).length) return false;
  S.exercises=keep;
  const to=id=>remap[id]||id;
  S.workouts.forEach(w=>{
    const seen={};
    w.exerciseIds=(w.exerciseIds||[]).map(to).filter(id=>seen[id]?false:(seen[id]=true));
  });
  S.sessions.forEach(s=>{
    const byEx={}, out=[];
    (s.entries||[]).forEach(en=>{
      en.exerciseId=to(en.exerciseId);
      const prev=byEx[en.exerciseId];
      if(prev){ prev.sets=(prev.sets||[]).concat(en.sets||[]); }   // same lift logged twice → one entry
      else { byEx[en.exerciseId]=en; out.push(en); }
    });
    s.entries=out;
  });
  if(S.active){
    const byEx={}, out=[];
    (S.active.entries||[]).forEach(en=>{
      en.exerciseId=to(en.exerciseId);
      const prev=byEx[en.exerciseId];
      if(prev){ if(!entryHasData(prev) && entryHasData(en)) prev.sets=en.sets; }
      else { byEx[en.exerciseId]=en; out.push(en); }
    });
    S.active.entries=out;
    if(S.active.removed){
      const t={};
      Object.keys(S.active.removed).forEach(id=>{ const n=to(id); t[n]=Math.max(t[n]||0, S.active.removed[id]||0); });
      S.active.removed=t;
    }
  }
  return true;
}

function exDisplay(ex){
  if(!ex) return "Exercise";
  const a = (ex.angle && ex.angle!=="None") ? ex.angle+" " : "";
  return `${a}${ex.name} (${ex.equipment})`;
}
function fmtDur(sec){
  sec = Math.max(0, Math.floor(sec));
  const h=Math.floor(sec/3600), m=Math.floor((sec%3600)/60), s=sec%60;
  const mm = (h?String(m).padStart(2,"0"):m);
  return (h?h+":":"") + mm + ":" + String(s).padStart(2,"0");
}
function fmtClock(sec){ const m=Math.floor(sec/60), s=sec%60; return m+":"+String(s).padStart(2,"0"); }
function fmtDate(ts){
  const d=new Date(ts), now=new Date();
  const same = d.toDateString()===now.toDateString();
  const yest = new Date(now-864e5).toDateString()===d.toDateString();
  const t = d.toLocaleTimeString([], {hour:"numeric",minute:"2-digit"});
  if(same) return "Today, "+t;
  if(yest) return "Yesterday, "+t;
  return d.toLocaleDateString([], {weekday:"short",month:"short",day:"numeric",year:(d.getFullYear()!==now.getFullYear()?"numeric":undefined)}) + ", " + t;
}
function timeOf(ts){ return new Date(ts).toLocaleTimeString([], {hour:"numeric",minute:"2-digit"}); }
// most recent logged WORKING sets for this profile + exercise (warmups excluded)
function lastSetsFor(profileId, exerciseId){
  for(let i=S.sessions.length-1;i>=0;i--){
    const s=S.sessions[i];
    if(s.profileId!==profileId) continue;
    const e=s.entries.find(en=>en.exerciseId===exerciseId);
    if(e){ const w=e.sets.filter(st=>!st.warmup); if(w.length) return w; }
  }
  return null;
}

/* ---------- assisted lifts ----------
   On an assisted pull-up/dip machine (or with a band), the number you log is HELP, not load —
   so less weight is progress, not regress. Everything that reads a weight for progression,
   volume or PRs asks isAssisted() first. Auto-detected from the name; ex.assisted (true/false)
   overrides that, so "Assisted Pull Up" works out of the box and anything odd can be flipped. */
const ASSIST_RE=/\bassist(ed|ance)?\b|\bband(ed)?\s*assist/i;
function looksAssisted(name){ return ASSIST_RE.test(String(name||"")); }
function isAssisted(ex){
  if(!ex) return false;
  if(ex.assisted===true) return true;
  if(ex.assisted===false) return false;
  return looksAssisted(ex.name);
}
function isAssistedId(exId){ return isAssisted(exById(exId)); }

/* ---------- progressive-overload recommendation (Nippard-style) ---------- */
function roundTo(v,step){ return Math.round(v/step)*step; }
// Jump scales with the load: ~2.5% upper / ~3.5% lower-body, rounded to 5 lb,
// never less than the smallest practical plate jump. So 135→+5 but 1080→+40.
function isLowerBody(ex){
  const n=((ex&&ex.name)||"").toLowerCase();
  return /squat|dead|leg press|lunge|hip thrust|rdl|romanian|hack|calf|leg curl|leg ext/.test(n);
}
function weightIncrement(ex, weight){
  const lower = isLowerBody(ex);
  const base = lower ? 10 : 5;
  const pct  = lower ? 0.035 : 0.025;
  const prop = roundTo((Number(weight)||0)*pct, 5);
  return Math.max(base, prop);
}
// Within a session the ghosts RAMP: each working set is offered ~5% (upper) / ~7% (lower)
// heavier than the one before it. Bigger than the between-session jump on purpose — this is
// climbing a pyramid inside one exercise, not earning a new working weight.
function rampIncrement(ex, weight){
  const lower = isLowerBody(ex);
  return Math.max(lower?10:5, roundTo((Number(weight)||0)*(lower?0.07:0.05), 5));
}
// Assistance comes OFF in stack-sized bites: ~10% of the help you're using, min 5 lb.
// 100 lb of help → −10, 40 → −5, and it floors at 0 (a real, unassisted rep).
function assistDecrement(weight){ return Math.max(5, roundTo((Number(weight)||0)*0.10, 5)); }
// allowZero: on an assisted lift 0 is a legitimate working number (no help at all), so an
// unassisted session must not read as "nothing logged" and reset you to the machine.
function workingWeightOf(sets, allowZero){
  const ws=sets.map(s=>(s.weight===""||s.weight==null)?null:(Number(s.weight)||0))
               .filter(w=>w!=null && (allowZero ? w>=0 : w>0));
  if(!ws.length) return 0;
  const cnt={}; ws.forEach(w=>cnt[w]=(cnt[w]||0)+1);
  let best=ws[0], bc=0;
  Object.keys(cnt).forEach(w=>{ if(cnt[w]>bc || (cnt[w]===bc && +w>best)){ best=+w; bc=cnt[w]; } });
  // Sets ramp within a session, so when every weight is distinct there is no mode to speak of
  // and the BASE — the first set you logged — is the working weight. Taking the heaviest there
  // would make next session start at today's top set and ramp again from it, compounding ~14%
  // a week whether or not you earned it. A straight-set session repeats a weight, so it still
  // resolves to the mode and is unaffected.
  return bc>1 ? best : ws[0];
}
function warmupsFor(w, reps){
  if(!w || w<50) return [];
  return [ {w:roundTo(w*0.5,5), r:reps}, {w:roundTo(w*0.7,5), r:reps} ];
}
// returns {working:[{w,r,rpe}], warmups:[{w,r}], note}
function recommend(pid, exId){
  const ex=exById(exId)||{}; const g=ex.goal||{};
  const repsLow = g.repsLow || g.repsHigh || 8;
  const repsHigh = g.repsHigh || g.repsLow || 12;
  const assisted = isAssisted(ex);
  const last=lastSetsFor(pid, exId);
  if(last && last.length){
    const nSets = g.sets || last.length;
    const wWeight = workingWeightOf(last, assisted);
    const hasLoad = assisted ? true : wWeight>0;
    const allHitTop = hasLoad && last.every(s=>(Number(s.reps)||0)>=repsHigh);
    const lastRpe = last[last.length-1] ? last[last.length-1].rpe : null;
    let working, note;
    if(allHitTop && assisted && wWeight<=0){
      // already unassisted — there's no help left to take away, so keep earning reps
      working=Array.from({length:nSets},()=>({w:0, r:repsHigh, rpe:g.rpe||null}));
      note=`Full bodyweight, ${repsHigh} on every set. Nothing left to strip — add reps, or start adding load.`;
    }else if(allHitTop && assisted){
      const dec=assistDecrement(wWeight); const newW=Math.max(0, roundTo(wWeight-dec,5));
      working=Array.from({length:nSets},()=>({w:newW, r:repsLow, rpe:g.rpe||null}));
      note = newW===0
        ? `Earned it — hit ${repsHigh} on every set. Drop the help entirely: <b>bodyweight × ${repsLow}</b>.`
        : `Earned it — hit ${repsHigh} on every set. Cut assistance to <b>${newW} lb × ${repsLow}</b> (−${wWeight-newW}).`;
    }else if(allHitTop){
      const inc=weightIncrement(ex, wWeight); const newW=roundTo(wWeight+inc,5);
      working=Array.from({length:nSets},()=>({w:newW, r:repsLow, rpe:g.rpe||null}));
      note=`Earned it — hit ${repsHigh} on every set. Go <b>${newW} lb × ${repsLow}</b> (+${inc}).`;
    }else{
      working=Array.from({length:nSets},(_,i)=>{
        const lr=last[i]?(Number(last[i].reps)||repsLow):repsLow;
        return {w:(assisted ? wWeight : (wWeight||"")), r:Math.min(repsHigh,lr+1), rpe:g.rpe||null};
      });
      const target=working.map(s=>s.r).join("/");
      const at = assisted ? (wWeight>0 ? wWeight+" lb help × " : "bodyweight × ") : (wWeight?wWeight+" lb × ":"");
      const then = assisted ? `Cut assistance once all sets reach ${repsHigh}.` : `Add weight once all sets reach ${repsHigh}.`;
      note=`Beat last time: <b>${at}${target}</b>${lastRpe?" (last RPE "+lastRpe+")":""}. ${then}`;
    }
    const todayW = (working[0] && working[0].w) ? working[0].w : wWeight;
    // assisted work is already the easy end of the movement — no ramp-up sets
    return { working, warmups:(assisted?[]:warmupsFor(todayW,repsLow)), note };
  }
  const nSets=g.sets||3;
  return { working:Array.from({length:nSets},()=>({w:"", r:repsLow, rpe:g.rpe||null})), warmups:[],
    note: assisted
      ? `First time — pick a help level you can do <b>${repsLow===repsHigh?repsLow:repsLow+"–"+repsHigh} reps</b> with, then we'll strip it off.`
      : `First time — aim <b>${repsLow===repsHigh?repsLow:repsLow+"–"+repsHigh} reps</b>, then we'll progress next time.` };
}
/* What the workout in progress is called: a name you typed for this session, else the
   template it came from, else the day. Whatever this says is what lands in History. */
function activeName(a){
  a=a||S.active; if(!a) return "";
  return a.name || (workoutById(a.workoutId)||{}).name || autoWorkoutName(a.startedAt);
}
const WEEKDAYS=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
function autoWorkoutName(ts){ return WEEKDAYS[new Date(ts||Date.now()).getDay()]+" Workout"; }
// a name we generated rather than one the user typed — don't prefill it into "name your template"
function isAutoName(n){ return !n || /^(Sunday|Monday|Tuesday|Wednesday|Thursday|Friday|Saturday) Workout$/.test(n) || n==="Quick Workout"; }
function workoutLastDone(workoutId, profileId){
  for(let i=S.sessions.length-1;i>=0;i--){
    const s=S.sessions[i];
    if(s.workoutId===workoutId && s.profileId===profileId) return s;
  }
  return null;
}
// a dumbbell exercise logged per-hand moves twice the load — count both for volume
function perSide(exOrId){ const e=(typeof exOrId==="string")?exById(exOrId):exOrId; return !!(e&&e.perSide); }
function loadFactor(exId){ return perSide(exId)?2:1; }
function sessionVolume(sess){
  let v=0;
  sess.entries.forEach(en=>{
    if(isAssistedId(en.exerciseId)) return;   // that number is help, not load — counting it inverts the meaning
    const f=loadFactor(en.exerciseId);
    en.sets.forEach(st=>{ if(st.warmup) return; v += (Number(st.weight)||0)*f*(Number(st.reps)||0); });
  });
  return Math.round(v);
}

/* ---------- personal records ----------
   Strength is compared with an estimated 1-rep max (Epley), so a heavier single and a
   lighter set of 10 are on the same scale. Warmups never count. */
function e1rm(w,r){ w=Number(w)||0; r=Number(r)||0; if(w<=0||r<=0) return 0; return w*(1+r/30); }
/* Assisted lifts run the same Epley scale, but on what you LIFTED rather than what helped you:
   a fixed reference minus the assistance. The constant only ever compares an exercise against
   itself, so its exact value doesn't matter — only that less help always outranks more. */
const ASSIST_REF=250;
function assistScore(assist, r){
  assist=Number(assist)||0; r=Number(r)||0;
  if(r<=0) return 0;
  return Math.max(5, ASSIST_REF-assist)*(1+r/30);
}
function bestSetIn(entry, assisted){
  if(assisted===undefined) assisted=isAssistedId(entry&&entry.exerciseId);
  let best=null;
  (entry&&entry.sets||[]).forEach(s=>{ if(s.warmup) return;
    if(assisted && (s.weight===""||s.weight==null) && !s.done) return;   // never logged, not a 0-assist rep
    const v = assisted ? assistScore(s.weight, s.reps) : e1rm(s.weight, s.reps);
    if(v>0 && (!best||v>best.v)) best={v, weight:Number(s.weight)||0, reps:Number(s.reps)||0, assisted:!!assisted}; });
  return best;
}
// how a best-set reads on an assisted lift: the reps matter, and the help is the qualifier
function setLabel(best){
  if(!best) return "";
  if(!best.assisted) return `${best.weight} × ${best.reps}`;
  return best.weight>0 ? `${best.reps} reps @ ${best.weight} help` : `${best.reps} reps unassisted`;
}
// best effort for this profile+exercise, optionally only counting sessions before a timestamp
function prFor(profileId, exerciseId, beforeTs){
  let best=null;
  S.sessions.forEach(s=>{
    if(s.profileId!==profileId) return;
    if(beforeTs!=null && !(s.endedAt<beforeTs)) return;
    s.entries.forEach(en=>{ if(en.exerciseId!==exerciseId) return;
      const b=bestSetIn(en); if(b && (!best||b.v>best.v)) best={...b, at:s.endedAt}; });
  });
  return best;
}
/* ============================================================
   ANALYSIS BATTERY — run the controls before naming anything a trend.
   1 RAW        naive totals (noted, never trusted on their own)
   2 NORMALIZE  strength per set (e1RM), not volume — volume rises just from training more
   3 CAPTURE    only sessions that actually recorded working sets
   4 EVENT      drop outlier sessions (>1 SD in set count) so one marathon day can't carry it
   5 DECOMPOSE  per exercise, and by weekday, to test "one lift" vs "broad"
   Every number carries n and a confidence flag; n<3 is directional only.
   The app reports OBSERVATIONS. It never states a cause.
   ============================================================ */
function profileSessions(pid){
  return S.sessions.filter(s=>s.profileId===pid).slice().sort((a,b)=>(a.endedAt||0)-(b.endedAt||0));
}
function workingSets(en){ return (en&&en.sets||[]).filter(s=>!s.warmup); }
function mean(a){ return a.length? a.reduce((x,y)=>x+y,0)/a.length : 0; }
function sd(a){ if(a.length<2) return 0; const m=mean(a); return Math.sqrt(mean(a.map(x=>(x-m)*(x-m)))); }
// step 3 CAPTURE: a session only counts for an exercise if it recorded real working sets
function exerciseSeries(pid, exId, opts){
  opts=opts||{};
  const rows=[];
  profileSessions(pid).forEach(s=>{
    const en=s.entries.find(e=>e.exerciseId===exId); if(!en) return;
    const ws=workingSets(en); if(!ws.length) return;                  // CAPTURE control
    const best=bestSetIn(en); if(!best) return;
    rows.push({ at:s.endedAt, e1rm:best.v, weight:best.weight, reps:best.reps,
      setCount:ws.length, sessionId:s.id });
  });
  if(opts.eventControl && rows.length>=4){                            // EVENT control
    const counts=rows.map(r=>r.setCount), m=mean(counts), s1=sd(counts);
    if(s1>0){ const kept=rows.filter(r=>Math.abs(r.setCount-m)<=s1); if(kept.length>=3) return kept; }
  }
  return rows;
}
function confidenceOf(n){
  if(n<3) return {label:"directional", cls:"low", note:`n=${n} — directional only`};
  if(n<6) return {label:"limited",     cls:"mid", note:`n=${n} — limited`};
  return   {label:"solid",             cls:"ok",  note:`n=${n}`};
}
// compare the first vs last third so a single session can't define the trend
function trendOf(series){
  const n=series.length;
  if(n<2) return {n, pct:null, conf:confidenceOf(n)};
  const k=Math.max(1, Math.floor(n/3));
  const first=mean(series.slice(0,k).map(r=>r.e1rm));
  const last =mean(series.slice(-k).map(r=>r.e1rm));
  const pct= first>0 ? ((last-first)/first)*100 : null;
  return {n, pct, first, last, k, conf:confidenceOf(n)};
}
// step 5 DECOMPOSE: is a change broad, or driven by one lift?
function decomposeByExercise(pid, opts){
  const ids=[...new Set(S.sessions.filter(s=>s.profileId===pid).flatMap(s=>s.entries.map(e=>e.exerciseId)))];
  return ids.map(id=>({ id, ex:exById(id), series:exerciseSeries(pid,id,opts) }))
            .filter(r=>r.ex && r.series.length)
            .map(r=>({ ...r, trend:trendOf(r.series) }))
            .sort((a,b)=>b.series.length-a.series.length);
}
// consistency is a RATE (sessions per week), not a count
function consistency(pid){
  const ss=profileSessions(pid);
  if(ss.length<2) return {n:ss.length, perWeek:null};
  const days=Math.max(1,(ss[ss.length-1].endedAt-ss[0].endedAt)/864e5);
  return {n:ss.length, perWeek: ss.length/(days/7), days:Math.round(days)};
}
function sparkline(vals,w,h){
  if(vals.length<2) return "";
  const min=Math.min(...vals), max=Math.max(...vals), span=(max-min)||1;
  const pts=vals.map((v,i)=>[ (i/(vals.length-1))*(w-4)+2, h-2-((v-min)/span)*(h-4) ]);
  const d=pts.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" ");
  const up=vals[vals.length-1]>=vals[0];
  const col=up?"var(--good)":"var(--bad)";
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" preserveAspectRatio="none" style="display:block">
    <path d="${d}" fill="none" stroke="${col}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="${pts[pts.length-1][0].toFixed(1)}" cy="${pts[pts.length-1][1].toFixed(1)}" r="3" fill="${col}"/>
  </svg>`;
}
// did this session set a new PR for that exercise? (strictly better than everything earlier)
function sessionSetPR(sess, exerciseId){
  const en=sess.entries.find(e=>e.exerciseId===exerciseId); if(!en) return null;
  const mine=bestSetIn(en); if(!mine) return null;
  const prev=prFor(sess.profileId, exerciseId, sess.endedAt);
  return (!prev || mine.v>prev.v+0.001) ? mine : null;
}

/* A render that stays on the same screen (adding a set, ticking one off) keeps the
   scroll position; only an actual navigation jumps to the top. And on the way out of
   a screen we stash it in tabMem, so coming back to that tab lands where you left —
   done here rather than in go() so it also covers the jumps between tabs (a session
   detail opening an exercise's progress, finishing a workout, …). */
let lastRoute={tab:"workouts",view:"list",id:null}, routeChanged=false, pendingScroll=null;
function rememberTab(){
  routeChanged = !(lastRoute.tab===route.tab && lastRoute.view===route.view
                   && (lastRoute.id||null)===(route.id||null));
  const m=tabMem[lastRoute.tab];
  // window.scrollY is still the outgoing screen's — the DOM hasn't been swapped yet
  if(m){ m.view=lastRoute.view; m.id=lastRoute.id; m.scroll=window.scrollY||0; }
  lastRoute={tab:route.tab, view:route.view, id:route.id};
}
function restoreScroll(){
  if(pendingScroll!=null){ window.scrollTo(0,pendingScroll); pendingScroll=null; }
  else if(routeChanged) window.scrollTo(0,0);
}

}

/* ============================================================
   SELF-UPDATE — a Home-Screen PWA can sit on cached HTML forever, which silently
   leaves one phone running old sync code. Poll the deployed version stamp and offer
   (or quietly apply) an update.
   ============================================================ */
let latestVersion=null;
async function checkForUpdate(){
  try{
    const r=await fetch("version.js?cb="+Date.now(), {cache:"no-store"});
    if(!r.ok) return;
    const m=(await r.text()).match(/"([^"]+)"/);
    if(!m) return;
    latestVersion=m[1];
    const cur=window.APP_VERSION||"";
    if(cur && latestVersion && latestVersion!==cur){
      // nothing in flight → just update; otherwise let them finish the set first
      if(!S.active && !modal){ applyUpdate(); return; }
      const b=document.getElementById("updbar"); if(b) b.style.display="block";
    }
  }catch(e){}
}
function applyUpdate(){
  // a fresh query string guarantees the HTML is refetched instead of served from cache
  const v=latestVersion||Date.now();
  location.replace(location.pathname+"?v="+encodeURIComponent(v));
}

/* ============================================================
   LIVE LINK — "working out together" across two phones.
   Each phone publishes its own presence (current exercise, last set,
   rest timer) to the cloud; partners see it live. Dormant w/o Firebase.
   ============================================================ */
let partners=[], partnerTicker=null;
const PRESENCE_TTL=90000; // treat as offline after 90s of no heartbeat
function myPresence(){
  const cur=curProfile();
  if(!S.active){
    return { profileId:S.currentProfileId, name:cur?cur.name:"", color:cur?cur.color:"#888", active:false, updatedAt:Date.now() };
  }
  const a=S.active;
  const ent=a.entries[a.entries.length-1];
  const ex=ent?exById(ent.exerciseId):null;
  let lastSet="", setsDone=0;
  a.entries.forEach(en=>en.sets.forEach(s=>{ if(s.done && !s.warmup){ setsDone++; lastSet=(s.weight||0)+" × "+(s.reps||0); }}));
  const prof=profile(a.profileId)||cur;
  // the exercise list travels with presence (always published) so "Together" can start any time
  const ids=a.entries.map(e=>e.exerciseId).filter(safeId);
  const defs=ids.map(id=>exById(id)).filter(Boolean)
    .map(e=>({id:e.id,name:e.name,equipment:e.equipment,angle:e.angle,assisted:isAssisted(e)}));
  return { profileId:a.profileId, name:prof?prof.name:"", color:prof?prof.color:"#888", active:true,
    workoutId:a.workoutId||null, workoutName:activeName(a), startedAt:a.startedAt,
    exercise:ex?exDisplay(ex):"", lastSet, setsDone, restEndsAt: rest.running?rest.endAt:null,
    joint: !!a.joint, listAt: a.listAt||a.startedAt, exerciseIds:ids, exercises:defs,
    removed: a.removed||{}, ss: ssMapOf(a.entries),   // supersets are part of the shared plan
    updatedAt:Date.now() };
}
function pushPresence(){ if(window.cloudPushPresence){ try{ window.cloudPushPresence(myPresence()); }catch(e){} } }

/* ---- JOINT workout: the shared EXERCISE LIST syncs live; each person's weights stay private.
   The list rides on each person's own presence doc (always published), so "Together" can be
   switched on at any time by either person — no chicken-and-egg with a separate plan doc. ---- */
let applyingPlan=false;
// note when I change my own exercise list, so the newer change wins over a stale partner list
function markListChanged(){ if(S.active){ S.active.listAt=Date.now(); save(); pushPresence(); } }
function pushPlan(){ pushPresence(); }   // list rides along with presence now
function endPlan(){ pushPresence(); }
// add any exercises the shared plan has that I don't (seeded with MY own recommended weights)
// has the user actually put anything into this exercise? (protects logged work from removal sync)
function entryHasData(en){
  return (en.sets||[]).some(s=>s.done || (s.weight!=="" && s.weight!=null) || (s.reps!=="" && s.reps!=null));
}
/* Merge rule: ADDS always union (so nobody's exercise is ever lost), REMOVALS travel as
   tombstones {exerciseId: whenRemoved}. A tombstone only wins over an entry that was added
   BEFORE it, and never removes an exercise you've already logged into. This converges no
   matter what order the two phones make changes in. */
function applyPlan(){
  if(!(S.active && S.active.joint)) return;
  const src=partners.filter(p=>Array.isArray(p.exerciseIds))
                    .sort((a,b)=>((b.joint?1:0)-(a.joint?1:0)) || ((b.listAt||0)-(a.listAt||0)))[0];
  if(!src) return;
  const theirAt=src.listAt||0;
  const theirRemoved=(src.removed && typeof src.removed==="object") ? src.removed : {};
  const tomb=S.active.removed=S.active.removed||{};
  applyingPlan=true;
  let changed=false;
  // adopt exercise DEFINITIONS we don't have (so a brand-new lift resolves immediately).
  // If it's a lift I already have under a different id — they typed "bench press", I have
  // "Bench Press" — alias theirs to mine instead of forking the library.
  const alias={};
  (src.exercises||[]).forEach(d=>{
    if(!(d && safeId(d.id)) || exById(d.id)) return;
    const name=String(d.name||"Exercise"), equipment=String(d.equipment||"Other"), angle=String(d.angle||"None");
    const mine=findExercise(name, equipment, angle);
    if(mine){ alias[d.id]=mine.id; return; }
    S.exercises.push({ id:d.id, name, equipment, angle, goal:null, assisted:!!d.assisted });
    changed=true;
  });
  const theirs=id=>alias[id]||id;
  // ADD anything of theirs I'm missing (seeded with MY OWN recommendations),
  // unless I removed it more recently than their last list change
  (src.exerciseIds||[]).forEach(rawId=>{
    if(!safeId(rawId)) return;
    const exId=theirs(rawId);
    if(!exById(exId)) return;
    if(S.active.entries.some(en=>en.exerciseId===exId)) return;
    if(tomb[exId] && tomb[exId]>=theirAt) return;          // my removal is newer — stay removed
    S.active.entries.unshift({exerciseId:exId, sets:seedSets(exId), addedAt:Date.now()});
    delete tomb[exId];
    changed=true;
  });
  // apply THEIR removals, and carry their tombstones forward
  Object.keys(theirRemoved).forEach(rawId=>{
    if(!safeId(rawId)) return;
    const exId=theirs(rawId);
    const ts=Number(theirRemoved[rawId])||0;
    const i=S.active.entries.findIndex(en=>en.exerciseId===exId);
    if(i>=0){
      const en=S.active.entries[i];
      const addedAt=en.addedAt||S.active.startedAt||0;
      if(ts>addedAt && !entryHasData(en)){ S.active.entries.splice(i,1); changed=true; }  // never drop logged work
    }
    if(ts>(tomb[exId]||0)){ tomb[exId]=ts; changed=true; }
  });
  // SUPERSETS ride the same "newest list wins" rule as the exercise list itself
  const myAt=S.active.listAt||S.active.startedAt||0;
  if(theirAt>myAt){
    const theirSs=src.ss||{};
    S.active.entries.forEach(en=>{
      const g=theirSs[en.exerciseId]||null;
      if((en.ss||null)!==g){ en.ss=g; changed=true; }
    });
  }
  if(changed) ssNormalizeActive();   // keep every group adjacent no matter who changed what
  applyingPlan=false;
  if(changed){ save(); render(); pushPresence(); }
}
// called by the Firebase module with all presence docs (includes the shared plan marker doc)
window.onPresence=function(list){
  const now=Date.now(); const arr=list||[];
  partners=arr
    .filter(p=>p && !p._plan && p.active && safeId(p.profileId) && p.profileId!==S.currentProfileId && (now-(p.updatedAt||0)<PRESENCE_TTL))
    .map(p=>{
      const rem={};
      if(p.removed && typeof p.removed==="object" && !Array.isArray(p.removed)){
        Object.keys(p.removed).forEach(k=>{ if(safeId(k)) rem[k]=Number(p.removed[k])||0; });
      }
      return {...p, color:safeColor(p.color),   // untrusted: validate before it reaches the DOM
        exerciseIds:(Array.isArray(p.exerciseIds)?p.exerciseIds:[]).filter(safeId),
        exercises:(Array.isArray(p.exercises)?p.exercises:[]).filter(d=>d&&safeId(d.id)),
        ss:safeSsMap(p.ss)||{},
        removed:rem};
    });
  // if my partner switched Together on, join them automatically so it only takes one tap
  if(S.active && !S.active.joint && partners.some(p=>p.joint)){ S.active.joint=true; S.active.planSynced=false; save(); }
  if(S.active && S.active.joint) applyPlan();
  renderPartner();
  const show = partners.length || (S.active && S.active.joint);
  if(show && !partnerTicker) partnerTicker=setInterval(renderPartner,1000);
  if(!show && partnerTicker){ clearInterval(partnerTicker); partnerTicker=null; }
};
function renderPartner(){
  const el=document.getElementById("partner"); if(!el) return;
  const now=Date.now();
  const live=partners.filter(p=>now-(p.updatedAt||0)<PRESENCE_TTL);
  const joint = !!(S.active && S.active.joint);
  const show = live.length || joint;
  if(!show){ el.innerHTML=""; el.style.display="none"; if(partnerTicker){ clearInterval(partnerTicker); partnerTicker=null; } return; }
  el.style.display="block";
  let html = joint ? `<div class="partner"><span class="plive" style="background:var(--good)"></span>
      <span class="pname" style="color:var(--good)">Together</span>
      <span class="pinfo">exercises sync · weights stay yours</span>
      <button class="joinbtn" style="background:var(--card2);color:var(--muted)" onclick="leaveTogether()">Leave</button></div>` : "";
  html += live.map(p=>{
    const dur=p.startedAt?fmtDur((now-p.startedAt)/1000):"";
    const resting = p.restEndsAt && p.restEndsAt>now;
    const info=[p.workoutName, dur, p.exercise, (!resting&&p.lastSet)?("last "+p.lastSet):""].filter(Boolean).join(" · ");
    const restTxt = resting?`<span class="prest">⏱ ${fmtClock(Math.round((p.restEndsAt-now)/1000))}</span>`:"";
    // "Join" starts the same workout; "Together" links lists when you're already training
    const joinBtn = (!S.active)
      ? `<button class="joinbtn" onclick="joinPartner('${safeId(p.workoutId)||''}')">Join</button>`
      : (!joint ? `<button class="joinbtn" onclick="startTogether()">Together</button>` : "");
    return `<div class="partner"><span class="plive" style="background:${safeColor(p.color)}"></span>
      <span class="pname" style="color:${safeColor(p.color)}">${escapeHtml(p.name)}</span>
      <span class="pinfo">${escapeHtml(info)}</span>${restTxt}${joinBtn}</div>`;
  }).join("");
  el.innerHTML=html;
}
// start the same workout your partner is doing and sync exercises with them
function joinPartner(workoutId){
  if(S.active){ return; }
  if(workoutId && workoutById(workoutId)) startWorkout(workoutId);

  if(S.active){ S.active.joint=true; S.active.planSynced=false; S.active.lastAdoptedAt=0; save(); applyPlan(); render(); pushPresence(); }
}
function startTogether(){
  if(!S.active) return;

function viewWorkouts(){

    const w=workoutById(S.active.workoutId);

  }
  html += `<div class="row between" style="margin:20px 2px 8px">
      <div style="font-weight:800;font-size:16px">Templates</div>
      <button class="btn ghost sm" style="width:auto" onclick="newTemplate()">+ New</button></div>`;
  if(S.workouts.length===0){
    html += `<div class="card" style="text-align:center;color:var(--muted)">

      <div class="sub" style="margin-top:4px">Make a reusable plan like "Push Day", or just start an empty workout and save it as a template at the end.</div></div>`;
  }else{
    // most recently touched template first — last performed, or when it was created if
    // it's never been done, so a template you just made lands at the top instead of the bottom
    const freshness = x => Math.max((x.last&&x.last.endedAt)||0, x.w.createdAt||0);
    const byRecent = S.workouts.map((w,i)=>({w,i,last:workoutLastDone(w.id, S.currentProfileId)}))
      .sort((a,b)=>(freshness(b)-freshness(a)) || (a.i-b.i));
    html += byRecent.map(({w,last})=>{
      return `<div class="card tap" onclick="openTemplate('${w.id}')">
        <div class="row between">
          <div style="min-width:0">
            <div class="wname">${escapeHtml(w.name)}</div>
            <div class="meta">${w.exerciseIds.length} exercise${w.exerciseIds.length!==1?'s':''}${last?` · last ${fmtDate(last.endedAt).replace(/,.*/,'')}`:' · not done yet'}</div>
            <div>${w.exerciseIds.slice(0,4).map(id=>`<span class="pill">${escapeHtml(shortName(id))}</span>`).join("")}${w.exerciseIds.length>4?`<span class="pill">+${w.exerciseIds.length-4}</span>`:''}</div>
          </div>

        </div></div>`;
    }).join("");
  }
  return html;
}

/* ============================================================
   SUPERSETS — two or more exercises you alternate between, resting only after
   the last one. Membership is a group id (`ss`) on the active entry / on the
   template's `ss` map. Only ADJACENT members count as a group, so a stale id
   from an older device can never make two far-apart exercises look linked;
   ssNormalize() is what keeps members adjacent after any change.
   ============================================================ */
function ssRest(){ const v=S.restSuperset; return (v==null||!isFinite(v)) ? 15 : v; }
// per-position info for a list of group ids: {gid,pos,size,letter,first,last} or null
function ssRuns(gids){
  const out=new Array(gids.length).fill(null);
  let i=0, n=0;
  while(i<gids.length){
    const g=gids[i];
    if(!g){ i++; continue; }
    let j=i; while(j+1<gids.length && gids[j+1]===g) j++;
    if(j>i){
      const size=j-i+1, letter=String.fromCharCode(65+(n++));
      for(let k=i;k<=j;k++) out[k]={gid:g, pos:k-i, size, letter, first:k===i, last:k===j};
    }
    i=j+1;
  }
  return out;
}
function activeRuns(){ return ssRuns((S.active?S.active.entries:[]).map(en=>en.ss||null)); }
function ssMapOf(entries){ const m={}; (entries||[]).forEach(en=>{ if(en.ss && safeId(en.exerciseId)) m[en.exerciseId]=en.ss; }); return m; }
function tplRuns(w){ return ssRuns((w.exerciseIds||[]).map(id=>(w.ss&&w.ss[id])||null)); }
// pull every group's members together, and dissolve any group that's down to one exercise
function ssNormalize(list, gidOf, clear){
  const gids=[];
  list.forEach(x=>{ const g=gidOf(x); if(g && gids.indexOf(g)<0) gids.push(g); });
  gids.forEach(gid=>{
    const members=list.filter(x=>gidOf(x)===gid);
    if(members.length<2){ members.forEach(clear); return; }
    const first=list.indexOf(members[0]);
    members.slice(1).forEach(m=>list.splice(list.indexOf(m),1));
    list.splice(first+1, 0, ...members.slice(1));
  });
}
function ssNormalizeActive(){ if(S.active) ssNormalize(S.active.entries, en=>en.ss||null, en=>{ en.ss=null; }); }
function ssNormalizeTpl(w){
  if(!w.ss) return;
  ssNormalize(w.exerciseIds, id=>w.ss[id]||null, id=>{ delete w.ss[id]; });
  if(!Object.keys(w.ss).length) w.ss=null;
}
// shared bits of chrome so the active workout, a template and a past session all read alike
function ssOpen(r){
  if(!(r&&r.first)) return "";
  return `<div class="sswrap"><div class="sslabel">🔗 Superset ${r.letter}
    <span class="r">${r.size} exercises · rest after the last</span></div>`;
}
function ssClose(r){ return (r&&r.last) ? `</div>` : ""; }
function ssBadge(r){ return r ? `<span class="ssidx">${r.letter}${r.pos+1}</span>` : ""; }

/* ----- active workout: link / unlink ----- */
function ssLink(ei, ti){
  const a=S.active; if(!a) return;
  const src=a.entries[ei], tgt=a.entries[ti];
  if(!src || !tgt || src===tgt) return;
  const gid = src.ss || uid();
  src.ss=gid; tgt.ss=gid;
  ssNormalizeActive();
  save(); closeModal(); render(); markListChanged();
}
function ssUnlink(ei){
  const a=S.active; if(!a) return;
  const en=a.entries[ei]; if(!en || !en.ss) return;
  const runs=activeRuns(); const r=runs[ei];
  en.ss=null;
  // park it just past its old group so the exercises left behind stay adjacent
  if(r){
    const last=ei-r.pos+r.size-1;
    a.entries.splice(ei,1);
    a.entries.splice(last, 0, en);
  }
  ssNormalizeActive();
  save(); closeModal(); render(); markListChanged();
}
/* the "⋯" menu on an exercise in the active workout */
// reorder exercises; supersets regroup from whatever ends up adjacent
/* Touch/mouse drag to reorder. The handle owns the gesture (touch-action:none) so the
   page still scrolls normally everywhere else. We only commit on release. */
let dragFrom=null, dragTo=null;
function exRows(){ return [...document.querySelectorAll(".exrow")]; }
function dragStart(e){
  const h=e.target.closest?e.target.closest("[data-drag]"):null; if(!h) return;
  if(!S.active) return;
  dragFrom=+h.dataset.drag; dragTo=dragFrom;
  const card=h.closest(".exrow"); if(card) card.classList.add("dragging");
  buzz(15);
  e.preventDefault();
  window.addEventListener("touchmove",dragMove,{passive:false});
  window.addEventListener("touchend",dragEnd);
  window.addEventListener("mousemove",dragMove);
  window.addEventListener("mouseup",dragEnd);
}
function dragMove(e){
  if(dragFrom==null) return;
  e.preventDefault();
  const y=(e.touches&&e.touches[0]?e.touches[0].clientY:e.clientY);
  let target=dragFrom;
  exRows().forEach(row=>{
    const i=+row.dataset.ei, b=row.getBoundingClientRect();
    if(y>b.top && y<b.bottom) target=i;
  });
  if(target!==dragTo){
    dragTo=target; buzz(10);
    exRows().forEach(row=>row.classList.toggle("dropzone", +row.dataset.ei===dragTo && dragTo!==dragFrom));
  }
}
function dragEnd(){
  window.removeEventListener("touchmove",dragMove);
  window.removeEventListener("touchend",dragEnd);
  window.removeEventListener("mousemove",dragMove);
  window.removeEventListener("mouseup",dragEnd);
  const from=dragFrom, to=dragTo;
  dragFrom=dragTo=null;
  exRows().forEach(row=>row.classList.remove("dragging","dropzone"));
  if(from!=null && to!=null && from!==to){ buzz(25); moveEntry(from,to); }
}
document.addEventListener("touchstart",dragStart,{passive:false});
document.addEventListener("mousedown",dragStart);

function moveEntry(from,to){
  const a=S.active; if(!a) return;
  if(to<0||to>=a.entries.length||from===to) return;
  const [row]=a.entries.splice(from,1); a.entries.splice(to,0,row);
  save(); markListChanged(); render();
}
function moveEntryUp(ei){ buzz(20); moveEntry(ei,ei-1); closeModal(); }
function moveEntryDown(ei){ buzz(20); moveEntry(ei,ei+1); closeModal(); }
function exerciseOpts(ei){
  const a=S.active; if(!a) return;

  const ex=exById(en.exerciseId);

  const rs=ssRest();
  openModal(`<h3>${escapeHtml(ex?ex.name:"Exercise")}</h3>
    ${r?`<div class="muted" style="margin:-4px 0 12px">In <b>superset ${r.letter}</b> (${r.pos+1} of ${r.size}) —
        ${rs>0?`${fmtClock(rs)} rest`:"no rest"} after this one, then the next exercise.</div>
      <button class="btn sec" onclick="ssUnlink(${ei})">🔗 Leave superset ${r.letter}</button>
      <div class="divider"></div>`:""}
    <div class="field"><label>${r?"Add another exercise to "+r.letter:"Superset with"}</label>
      ${cands.length
        ? `<div class="liblist">${cands.map(o=>{
            const ce=exById(o.e.exerciseId);
            return `<div class="libitem" onclick="ssLink(${ei},${o.i})">
              <div><div class="nm">${escapeHtml(ce?ce.name:"Exercise")}</div>
                <div class="eq">${escapeHtml(ce?[(ce.angle&&ce.angle!=="None")?ce.angle:null,ce.equipment].filter(Boolean).join(" · "):"")}</div></div>
              <div class="muted">🔗 link</div></div>`;
          }).join("")}</div>
           <div class="muted" style="font-size:12px;margin:-2px 2px 0">Alternate sets between them; the timer only
             runs the full ${fmtClock(S.restDefault||90)} after the last exercise in the group.</div>`
        : `<div class="muted">Add another (ungrouped) exercise to this workout first.</div>`}
    </div>
    <div class="divider"></div>
    <div class="field"><label>Order</label>
      <div class="opts">
        <button class="opt" ${ei===0?"disabled style=\"opacity:.4\"":""} onclick="moveEntryUp(${ei})">↑ Move up</button>
        <button class="opt" ${ei===a.entries.length-1?"disabled style=\"opacity:.4\"":""} onclick="moveEntryDown(${ei})">↓ Move down</button>
      </div>

        <button class="opt ${!perSide(ex)?'on':''}" onclick="setPerSide('${en.exerciseId}',false)">Total</button>
        <button class="opt ${perSide(ex)?'on':''}" onclick="setPerSide('${en.exerciseId}',true)">Per dumbbell</button>
      </div>
      <div class="muted" style="font-size:12px;margin-top:7px">${perSide(ex)
        ? "You log one dumbbell (e.g. <b>30</b> means a 30 in each hand) — volume counts both, so 30 × 10 scores 600."
        : "You log the whole load. Two 30s would be logged as <b>60</b>."}</div>
    </div>` : ""}
    <div class="divider"></div>
    <button class="btn danger" onclick="removeEntry(${ei})">Remove exercise</button>`);
}
function setPerSide(exId, on){
  const ex=exById(exId); if(!ex) return;

/* ----- templates: link / unlink (same rules, stored as a map on the template) ----- */
function tplExOpts(wid, exId){
  const w=workoutById(wid); if(!w) return;

    </div>

}
function ssLinkTpl(wid, exId, otherId){
  const w=workoutById(wid); if(!w) return;
  w.ss=w.ss||{};
  const gid=w.ss[exId]||uid();
  w.ss[exId]=gid; w.ss[otherId]=gid;
  ssNormalizeTpl(w);
  save(); closeModal(); render();
}
function ssUnlinkTpl(wid, exId){
  const w=workoutById(wid); if(!w || !w.ss || !w.ss[exId]) return;
  const i=w.exerciseIds.indexOf(exId);
  const r=tplRuns(w)[i];
  delete w.ss[exId];
  if(r){
    const last=i-r.pos+r.size-1;
    w.exerciseIds.splice(i,1);
    w.exerciseIds.splice(last, 0, exId);
  }
  ssNormalizeTpl(w);
  save(); closeModal(); render();
}

}

/* ---------- Progress tab: the analysis battery, in order ---------- */
let progControls=true;   // EVENT control on by default
function viewProgress(){
  const pid=S.currentProfileId, p=curProfile();
  const ss=profileSessions(pid);
  let html=`<div class="h1" style="margin-bottom:4px">Progress</div>
    <div class="sub" style="margin:0 2px 14px"><b style="color:${safeColor(p.color)}">${escapeHtml(p.name)}</b>'s numbers</div>`;
  if(ss.length===0){
    return html+`<div class="empty"><div class="big">📈</div><div>No finished workouts yet.</div>
      <div class="sub" style="margin-top:6px">Log a couple of sessions and the trends show up here.</div></div>`;
  }
  const rows=decomposeByExercise(pid,{eventControl:progControls});

  // 1 RAW — stated plainly as raw, so it isn't mistaken for progress
  const sets=ss.reduce((a,s)=>a+s.entries.reduce((b,e)=>b+workingSets(e).length,0),0);
  const vol=ss.reduce((a,s)=>a+sessionVolume(s),0);
  html+=`<div class="anacard"><div class="anahead"><span class="anastep">1 · Raw</span></div>
    <div class="row between" style="margin-top:8px">
      <div><div class="wname">${ss.length}</div><div class="meta">workouts</div></div>
      <div><div class="wname">${sets}</div><div class="meta">working sets</div></div>
      <div><div class="wname">${vol.toLocaleString()}</div><div class="meta">lb volume</div></div>
    </div>
    <div class="anafoot">Totals only. They rise with more training, so they can't show whether you're getting stronger.</div></div>`;

  // 2 NORMALIZE — a rate, not a count
  const c=consistency(pid);
  html+=`<div class="anacard"><div class="anahead"><span class="anastep">2 · Normalized</span></div>
    <div class="row between" style="margin-top:8px">
      <div><div class="wname">${c.perWeek?c.perWeek.toFixed(1):"–"}</div><div class="meta">workouts / week</div></div>
      <div><div class="wname">${ss.length?Math.round(sets/ss.length):0}</div><div class="meta">sets / workout</div></div>
      <div><div class="wname">${c.days||0}</div><div class="meta">days tracked</div></div>
    </div>
    <div class="anafoot">Rates instead of totals, so a longer span doesn't look like improvement.</div></div>`;

  // 3+4 CAPTURE / EVENT controls
  html+=`<div class="anacard"><div class="anahead"><span class="anastep">3 · Controls</span>
      <button class="ctlbtn ${progControls?'on':''}" onclick="progControls=!progControls;render()">${progControls?'On':'Off'}</button></div>
    <div class="anafoot" style="margin-top:8px">Warm-ups and sessions with no working sets are always excluded.
      ${progControls
        ? `Outlier sessions (set count &gt;1 SD from your norm) are dropped too, so one unusual day can't create a trend. <b>Tap to see it uncontrolled.</b>`
        : `Outlier sessions are currently <b>included</b> — a single marathon or cut-short day can distort the trend. <b>Tap to re-enable.</b>`}</div></div>`;

  // 5 DECOMPOSE — per lift, so "broad" vs "one lift" is visible
  html+=`<div class="anacard"><div class="anahead"><span class="anastep">5 · By exercise</span></div>
    <div class="anafoot" style="margin:8px 0 0">Strength per lift, measured by best estimated 1-rep max — that's comparable across
      different rep counts. Change compares your first third to your last third.</div></div>`;
  html+=rows.map(r=>{
    const t=r.trend, vals=r.series.map(x=>x.e1rm);
    const pct=(t.pct==null)?null:t.pct;
    const arrow=pct==null?"":(pct>1?"▲":(pct<-1?"▼":"▬"));
    const col=pct==null?"var(--muted)":(pct>1?"var(--good)":(pct<-1?"var(--bad)":"var(--muted)"));
    const best=prFor(pid,r.id);
    return `<div class="card tap" onclick="openExerciseProgress('${r.id}')">
      <div class="row between">
        <div style="min-width:0">
          <div class="exname">${escapeHtml(r.ex.name)}</div>
          <div class="exsub">${escapeHtml([(r.ex.angle&&r.ex.angle!=="None")?r.ex.angle:null,r.ex.equipment].filter(Boolean).join(" · "))}</div>
        </div>
        <div style="text-align:right;flex:none">
          <div style="font-weight:800;font-size:15px;color:${col}">${pct==null?"—":arrow+" "+(pct>0?"+":"")+pct.toFixed(1)+"%"}</div>
          <div class="conf ${t.conf.cls}">${escapeHtml(t.conf.note)}</div>
        </div>
      </div>
      <div style="margin-top:8px">${sparkline(vals,300,34)}</div>
      <div class="meta" style="margin-top:6px">${best?`PR ${best.weight} × ${best.reps}`:""}${best?" · ":""}${r.series.length} session${r.series.length!==1?"s":""}</div>
    </div>`;
  }).join("");

  const solid=rows.filter(r=>r.trend.n>=3);
  const up=solid.filter(r=>r.trend.pct>1).length, down=solid.filter(r=>r.trend.pct<-1).length;
  html+=`<div class="anacard"><div class="anahead"><span class="anastep">Observation</span></div>
    <div class="anafoot" style="margin-top:8px">${
      solid.length===0
        ? `Not enough repeated lifts yet to say anything — every exercise is still under 3 sessions (directional only).`
        : `Of ${solid.length} lift${solid.length!==1?"s":""} with n≥3: <b>${up} up</b>, <b>${down} down</b>, ${solid.length-up-down} flat.
           ${up>=Math.max(2,solid.length*0.6) ? "That's broad rather than one lift." : (up<=1&&solid.length>=3 ? "That's narrow — driven by a small number of lifts." : "Mixed across lifts.")}`
    }<br><span style="opacity:.75">Pattern only — this doesn't say why.</span></div></div>`;
  return html;
}

  if(S.active && S.active.workoutId!==id){

        ss: (w.ss&&w.ss[exId])||null })) };   // the template's supersets come along
    ssNormalizeActive();
