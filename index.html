<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="H+A Workouts" />
<meta name="theme-color" content="#0e0f13" />
<link rel="manifest" href="manifest.json" />
<title>Hyebin & Andrew Workouts</title>
<style>
  :root{
    --bg:#f4f6fa; --card:#ffffff; --card2:#eef1f6; --line:#e2e6ee;
    --txt:#141821; --muted:#697086; --accent:#2f7bff; --accent2:#1b5fe0;
    --good:#15b877; --warn:#e6960a; --bad:#e5484d;
    --bgblur:244,246,250; --shadow:0 1px 3px rgba(20,30,60,.07);
    --safe-top:env(safe-area-inset-top); --safe-bot:env(safe-area-inset-bottom);
  }
  body.dark{
    --bg:#0e0f13; --card:#171a21; --card2:#1f232c; --line:#2a2f3a;
    --txt:#f2f4f8; --muted:#8b93a5; --good:#27c281; --warn:#ffb020; --bad:#ff5d5d;
    --bgblur:14,15,19; --shadow:0 8px 24px rgba(0,0,0,.4);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--txt);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
    overscroll-behavior-y:none;-webkit-text-size-adjust:100%}
  body{padding-bottom:calc(64px + var(--safe-bot))}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  input,select{font-family:inherit}
  .app{max-width:560px;margin:0 auto}

  /* ===== Top bar ===== */
  header{position:sticky;top:0;z-index:50;background:rgba(var(--bgblur),.9);
    backdrop-filter:saturate(140%) blur(12px);border-bottom:1px solid var(--line);
    padding:calc(var(--safe-top) + 8px) 14px 8px}
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .brand{font-weight:800;font-size:20px;letter-spacing:-.3px}
  .brand span{color:var(--accent)}
  .profiles{display:flex;gap:7px;align-items:center;overflow-x:auto;padding:10px 0 2px;scrollbar-width:none}
  .profiles::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto;display:flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;
    background:var(--card);border:1px solid var(--line);font-size:13px;font-weight:600;color:var(--muted)}
  .chip.active{color:#fff;border-color:transparent}
  .chip .dot{width:9px;height:9px;border-radius:50%}
  .chip.add{color:var(--accent);font-weight:700}
  #partner{margin-top:8px}
  .partner{display:flex;align-items:center;gap:7px;background:var(--card);border:1px solid var(--line);
    border-radius:12px;padding:8px 11px;margin-bottom:4px;box-shadow:var(--shadow)}
  .partner .plive{width:8px;height:8px;border-radius:50%;flex:0 0 auto;animation:pulse 1.6s ease-in-out infinite}
  @keyframes pulse{50%{opacity:.3}}
  .partner .pname{font-weight:800;font-size:13px;flex:0 0 auto}
  .partner .pinfo{color:var(--muted);font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1 1 auto}
  .partner .prest{color:var(--accent);font-weight:800;flex:0 0 auto;font-variant-numeric:tabular-nums}

  /* ===== Views ===== */
  main{padding:14px}
  .h1{font-size:26px;font-weight:800;letter-spacing:-.5px;margin:4px 2px 14px}
  .sub{color:var(--muted);font-size:13px}
  .row{display:flex;align-items:center;gap:10px}
  .between{justify-content:space-between}

  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;
    background:var(--accent);color:#fff;font-weight:700;font-size:16px;
    padding:14px 18px;border-radius:14px;width:100%}
  .btn:active{background:var(--accent2)}
  .btn.sec{background:var(--card2);color:var(--txt);border:1px solid var(--line)}
  .btn.ghost{background:transparent;color:var(--accent);font-weight:700}
  .btn.danger{background:transparent;color:var(--bad);border:1px solid #4a2730}
  .btn.sm{padding:9px 12px;font-size:14px;width:auto;border-radius:11px}

  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:var(--shadow)}
  .card.tap:active{background:var(--card2)}
  .wname{font-size:18px;font-weight:700}
  .meta{color:var(--muted);font-size:13px;margin-top:3px}
  .pill{display:inline-block;background:var(--card2);border:1px solid var(--line);
    color:var(--muted);font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;margin:3px 5px 0 0}

  .empty{text-align:center;color:var(--muted);padding:50px 20px}
  .empty .big{font-size:46px;margin-bottom:8px}

  /* ===== Active workout ===== */
  .stickybar{position:sticky;top:0;z-index:40;background:var(--card);border:1px solid var(--line);
    border-radius:14px;padding:10px 12px;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between}
  .timerbig{font-variant-numeric:tabular-nums;font-weight:800;font-size:20px}
  .exhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
  .exname{font-weight:700;font-size:16px}
  .exsub{color:var(--accent);font-size:12.5px;font-weight:600;margin-top:1px}
  .setgrid{width:100%;border-collapse:collapse;margin-top:6px}
  .setgrid th{color:var(--muted);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;
    text-align:center;padding:4px 2px}
  .setgrid td{text-align:center;padding:4px 2px}
  .setgrid th.l,.setgrid td.l{text-align:left}
  .setno{width:34px;font-weight:700;color:var(--muted)}
  .prevcell{color:var(--muted);font-size:13px;white-space:nowrap}
  .inp{width:62px;background:var(--card2);border:1px solid var(--line);color:var(--txt);
    text-align:center;font-size:16px;font-weight:600;padding:9px 4px;border-radius:10px}
  .inp.rpe{width:52px}
  .inp:focus{outline:none;border-color:var(--accent)}
  .inp::placeholder{color:var(--muted);opacity:.65;font-weight:600}
  tr.done .inp{background:rgba(39,194,129,.12);border-color:rgba(39,194,129,.45)}
  tr.wu .setno{color:var(--warn);font-weight:800;font-size:11px}
  tr.wu .inp{opacity:.92}
  .recnote{display:flex;gap:6px;align-items:flex-start;color:var(--muted);font-size:12px;font-weight:600;
    margin:8px 2px 2px;line-height:1.45}
  .recnote b{color:var(--accent)}
  .check{width:34px;height:34px;border-radius:10px;background:var(--card2);border:1px solid var(--line);
    font-size:16px;display:inline-flex;align-items:center;justify-content:center}
  tr.done .check{background:var(--good);border-color:var(--good);color:#062}
  .howbtn{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;color:#ff3b30;
    background:var(--card2);border:1px solid var(--line);border-radius:9px;padding:6px 9px;white-space:nowrap}
  .howbtn:active{background:var(--line)}
  .rpeq{display:inline-flex;align-items:center;justify-content:center;width:15px;height:15px;border-radius:50%;
    border:1px solid var(--muted);color:var(--muted);font-size:10px;font-weight:800;vertical-align:middle}
  .rpetable{width:100%;border-collapse:collapse;margin:2px 0 14px}
  .rpetable td{padding:8px 6px;border-top:1px solid var(--line);vertical-align:top;font-size:14px}
  .rpetable td.n{width:46px;font-weight:800;color:var(--accent);text-align:center}
  .guide{display:flex;align-items:center;gap:8px;margin-top:10px;padding:10px 11px;border-radius:11px;
    background:rgba(47,123,255,.09);border:1px solid rgba(47,123,255,.28);color:var(--txt);font-size:13px;font-weight:600}
  .guide .ic{font-size:14px;flex:0 0 auto}
  .guide.empty{color:var(--accent);background:var(--card2);border-style:dashed;border-color:var(--line);font-weight:700}
  .guide .edit{margin-left:auto;color:var(--muted);font-size:11px;font-weight:700;flex:0 0 auto}
  .gline{display:flex;align-items:center;gap:10px;margin-bottom:14px}
  .gline .lbl{width:84px;color:var(--muted);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.4px}
  .stepper{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:11px;overflow:hidden;background:var(--card2)}
  .stepper button{width:42px;height:44px;font-size:22px;font-weight:700;color:var(--accent);background:transparent}
  .stepper button:active{background:var(--line)}
  .stepin{width:52px;height:44px;border:none;background:transparent;text-align:center;font-size:18px;font-weight:800;color:var(--txt)}
  .stepin:focus{outline:none}
  .rangeto{color:var(--muted);font-weight:700;margin:0 3px}
  textarea.text{width:100%;min-height:60px;resize:vertical;font-family:inherit;background:var(--card2);
    border:1px solid var(--line);color:var(--txt);font-size:16px;padding:12px;border-radius:12px}
  textarea.text:focus{outline:none;border-color:var(--accent)}
  .delset{color:var(--muted);font-size:18px;width:24px}
  .addset{color:var(--accent);font-weight:700;font-size:14px;padding:9px;width:100%;
    background:var(--card2);border:1px dashed var(--line);border-radius:11px;margin-top:8px}

  /* ===== Rest timer ===== */
  #rest{position:fixed;left:0;right:0;bottom:calc(64px + var(--safe-bot));z-index:60;display:none}
  #rest .inner{max-width:560px;margin:0 auto;padding:0 12px}
  .restbar{background:var(--accent);color:#fff;border-radius:14px;padding:10px 12px;
    display:flex;align-items:center;justify-content:space-between;box-shadow:0 8px 24px rgba(0,0,0,.4)}
  .restbar.ring{animation:flash .5s ease-in-out 3}
  @keyframes flash{50%{background:var(--good)}}
  .restctl{display:flex;align-items:center;gap:6px}
  .restctl button{background:rgba(255,255,255,.18);color:#fff;font-weight:700;border-radius:9px;padding:7px 10px;font-size:13px}
  .resttime{font-variant-numeric:tabular-nums;font-weight:800;font-size:22px;min-width:64px;text-align:center}

  /* ===== Bottom nav ===== */
  nav{position:fixed;left:0;right:0;bottom:0;z-index:55;background:rgba(var(--bgblur),.95);
    backdrop-filter:blur(12px);border-top:1px solid var(--line);
    padding-bottom:var(--safe-bot)}
  .navinner{max-width:560px;margin:0 auto;display:flex}
  .navbtn{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;
    padding:9px 0 7px;color:var(--muted);font-size:11px;font-weight:600}
  .navbtn .ic{font-size:21px;line-height:1}
  .navbtn.active{color:var(--accent)}

  /* ===== Modal ===== */
  .overlay{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;
    justify-content:center;padding:0}
  .sheet{background:var(--card);width:100%;max-width:560px;border-radius:20px 20px 0 0;
    border-top:1px solid var(--line);padding:16px 16px calc(20px + var(--safe-bot));max-height:88vh;overflow:auto;
    animation:slideup .22s ease}
  @keyframes slideup{from{transform:translateY(100%)}}
  .sheet h3{margin:2px 0 14px;font-size:19px;font-weight:800}
  .field{margin-bottom:14px}
  .field label{display:block;color:var(--muted);font-size:12px;font-weight:700;text-transform:uppercase;
    letter-spacing:.4px;margin-bottom:7px}
  .field input.text{width:100%;background:var(--card2);border:1px solid var(--line);color:var(--txt);
    font-size:17px;padding:13px;border-radius:12px}
  .field input.text:focus{outline:none;border-color:var(--accent)}
  .opts{display:flex;flex-wrap:wrap;gap:8px}
  .opt{padding:10px 14px;border-radius:11px;background:var(--card2);border:1px solid var(--line);
    font-weight:600;font-size:14px;color:var(--muted)}
  .opt.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .liblist{margin:0 0 4px}
  .libitem{display:flex;align-items:center;justify-content:space-between;padding:13px 12px;border-radius:12px;
    background:var(--card2);border:1px solid var(--line);margin-bottom:8px}
  .libitem:active{border-color:var(--accent)}
  .libitem .nm{font-weight:600}
  .libitem .eq{color:var(--muted);font-size:12px;margin-top:2px}
  .divider{height:1px;background:var(--line);margin:14px 0}
  .muted{color:var(--muted)}
  .right{margin-left:auto}

  /* ===== Login gate ===== */
  #gate{display:none;position:fixed;inset:0;z-index:90;background:var(--bg);
    align-items:center;justify-content:center;padding:24px calc(24px + env(safe-area-inset-right)) 24px calc(24px + env(safe-area-inset-left))}
  .gatecard{width:100%;max-width:420px;text-align:center}
  .gatebrand{font-size:30px;font-weight:800;letter-spacing:-.5px}
  .gatebrand span{color:var(--accent)}
  .gatesub{color:var(--muted);font-size:16px;margin:8px 0 28px;font-weight:600}
  .gatebtns{display:flex;flex-direction:column;gap:14px}
  .gatebtn{display:flex;align-items:center;justify-content:center;gap:12px;padding:22px;border-radius:18px;
    background:var(--card);border:2px solid var(--pc,var(--line));color:var(--txt);font-size:22px;font-weight:800;box-shadow:var(--shadow)}
  .gatebtn:active{background:var(--card2)}
  .gatebtn .gdot{width:14px;height:14px;border-radius:50%;background:var(--pc,var(--muted))}
  .gateadd{margin-top:22px;color:var(--accent);font-weight:700;font-size:15px}
  .joinbtn{flex:0 0 auto;font-size:12px;font-weight:800;color:#fff;background:var(--accent);
    border-radius:9px;padding:6px 11px}
  .joinbtn:active{background:var(--accent2)}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="topbar">
      <div class="brand" onclick="openGate()" title="Switch user">Hyebin <span>&amp;</span> Andrew</div>
      <button class="btn ghost sm" id="themeBtn" style="width:auto"></button>
    </div>
    <div class="profiles" id="profiles"></div>
    <div id="partner"></div>
  </header>
  <main id="view"></main>
  <div id="ver" style="text-align:center;color:var(--muted);font-size:11px;padding:8px 0 96px;line-height:1.6"></div>
</div>

<div id="rest"><div class="inner"><div class="restbar" id="restbar">
  <div class="restctl">
    <button data-rest="-15">−15</button>
    <button data-rest="+15">+15</button>
  </div>
  <div class="resttime" id="restTime">0:00</div>
  <div class="restctl">
    <button data-rest="skip">Skip ✓</button>
  </div>
</div></div></div>

<nav><div class="navinner" id="nav"></div></nav>

<div id="gate"></div>

<script src="version.js"></script>
<script src="firebase-config.js"></script>
<script>
"use strict";
/* ============================================================
   LiftLog — a Strong-style workout tracker (single file, localStorage)
   ============================================================ */
const STORE_KEY = "liftlog.v1";
const EQUIPMENT = ["Barbell","Dumbbell","Machine","Cables","Smith","Bodyweight","Kettlebell","Other"];
const ANGLES = ["None","Flat","Incline","Decline"];
const PROFILE_COLORS = ["#2f7bff","#ff6b9d","#27c281","#ffb020","#a16bff","#ff7a45"];

/* ---------- state ---------- */
let S = load();
let route = { tab:"workouts", view:"list", id:null };  // view: list | active | session
let modal = null;
let beepCtx = null;

function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }

function load(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  // stable ids so every device shares the SAME two profiles (no duplicates when syncing)
  return {
    units:"lb",
    theme:"light",
    profiles:[{id:"hyebin",name:"Hyebin",color:PROFILE_COLORS[1]},{id:"andrew",name:"Andrew",color:PROFILE_COLORS[0]}],
    currentProfileId:"hyebin",
    exercises:[],     // library: {id,name,equipment,angle}
    workouts:[],      // templates: {id,name,exerciseIds:[]}
    sessions:[],      // completed: {id,workoutId,workoutName,profileId,startedAt,endedAt,durationSec,entries:[...]}
    active:null,      // {workoutId,profileId,startedAt,entries:[{exerciseId,sets:[{weight,reps,rpe,done}]}]}
    restDefault:90
  };
}
function save(){ localStorage.setItem(STORE_KEY, JSON.stringify(S)); scheduleCloudPush(); }

/* ============================================================
   CLOUD SYNC (Firebase) — optional, shared across both phones.
   Synced data = profiles + exercise library + templates + sessions.
   Device-only (NOT synced) = theme, current profile, in-progress workout.
   The Firebase module (bottom of file) defines window.cloudPush + calls
   window.onCloudData when remote data arrives. If no config, app stays local.
   ============================================================ */
let applyingRemote=false, cloudTimer=null, lastSync="";
function cloudOn(){ return !!(window.FIREBASE_CONFIG && window.FIREBASE_CONFIG.apiKey); }
function syncedState(){ return {profiles:S.profiles, exercises:S.exercises, workouts:S.workouts, sessions:S.sessions}; }
function setSync(msg){ lastSync=msg; const s=document.getElementById("syncStat"); if(s) s.textContent=msg; }
function scheduleCloudPush(){
  if(applyingRemote || !window.cloudPush) return;
  if(cloudTimer) clearTimeout(cloudTimer);
  cloudTimer=setTimeout(()=>{
    try{ Promise.resolve(window.cloudPush(syncedState()))
      .then(()=>setSync("✓ synced")).catch(()=>setSync("⚠ will sync when online")); }
    catch(e){ setSync("⚠ offline"); }
  },700);
}
function mergeArrById(localArr, remoteArr){
  const m=new Map((localArr||[]).map(x=>[x.id,x]));
  (remoteArr||[]).forEach(x=>{ if(x&&x.id) m.set(x.id,x); });
  return [...m.values()];
}
/* ---- security: treat all cloud data as untrusted ----
   ids are interpolated into inline on* handlers and colors into style="",
   so validate them at ingest. Anything that doesn't match a safe shape is
   dropped/replaced (text fields are still HTML-escaped at render time). */
const SAFE_ID=/^[A-Za-z0-9_-]{1,64}$/;
const SAFE_HEX=/^#[0-9a-fA-F]{3,8}$/;
function safeId(x){ return (typeof x==="string" && SAFE_ID.test(x)) ? x : null; }
function safeColor(x){ return (typeof x==="string" && SAFE_HEX.test(x)) ? x : "#8b93a5"; }
function sanitizeCloud(r){
  r=r||{};
  const arr=x=>Array.isArray(x)?x:[];
  return {
    profiles: arr(r.profiles).filter(p=>p&&safeId(p.id)).map(p=>({...p, color:safeColor(p.color)})),
    exercises: arr(r.exercises).filter(e=>e&&safeId(e.id)),
    workouts: arr(r.workouts).filter(w=>w&&safeId(w.id))
      .map(w=>({...w, exerciseIds: arr(w.exerciseIds).filter(safeId)})),
    sessions: arr(r.sessions).filter(s=>s&&safeId(s.id))
      .map(s=>({...s, entries: arr(s.entries).filter(en=>en&&safeId(en.exerciseId))}))
  };
}
// called by the Firebase module when remote data changes
window.onCloudData=function(remote){
  if(!remote) return;
  remote=sanitizeCloud(remote);
  applyingRemote=true;
  const extra = (S.sessions.length>(remote.sessions||[]).length)
             || (S.workouts.length>(remote.workouts||[]).length)
             || (S.exercises.length>(remote.exercises||[]).length)
             || (S.profiles.length>(remote.profiles||[]).length);
  S.profiles  = mergeArrById(S.profiles,  remote.profiles);
  S.exercises = mergeArrById(S.exercises, remote.exercises);
  S.workouts  = mergeArrById(S.workouts,  remote.workouts);
  S.sessions  = mergeArrById(S.sessions,  remote.sessions);
  dedupeProfiles();  // collapse any duplicate profiles introduced by the merge
  if(!S.profiles.some(p=>p.id===S.currentProfileId) && S.profiles[0]) S.currentProfileId=S.profiles[0].id;
  localStorage.setItem(STORE_KEY, JSON.stringify(S));
  applyingRemote=false;
  setSync("✓ synced");
  render();
  // if we held data the cloud didn't have, push our superset so the other phone gets it
  if(extra && window.cloudPush){ try{ window.cloudPush(syncedState()); }catch(e){} }
};
window.onCloudReady=function(){ setSync("✓ cloud connected"); };
window.setSyncErr=function(){ setSync("⚠ offline"); };

/* ---------- helpers ---------- */
function profile(id){ return S.profiles.find(p=>p.id===id); }
function curProfile(){ return profile(S.currentProfileId); }
function exById(id){ return S.exercises.find(e=>e.id===id); }
function workoutById(id){ return S.workouts.find(w=>w.id===id); }
// collapse duplicate profiles (same name) that older devices created before stable ids;
// keeps the canonical stable id and remaps any history/current-profile to it.
function dedupeProfiles(){
  const groups={};
  S.profiles.forEach(p=>{ const k=(p.name||"").trim().toLowerCase(); (groups[k]=groups[k]||[]).push(p); });
  const remap={}, keep=[];
  Object.keys(groups).forEach(k=>{
    const g=groups[k];
    const winner=g.find(p=>p.id==="hyebin"||p.id==="andrew") || g[0];
    keep.push(winner);
    g.forEach(p=>{ if(p.id!==winner.id) remap[p.id]=winner.id; });
  });
  if(!Object.keys(remap).length) return false;
  S.profiles=keep;
  S.sessions.forEach(s=>{ if(remap[s.profileId]) s.profileId=remap[s.profileId]; });
  if(remap[S.currentProfileId]) S.currentProfileId=remap[S.currentProfileId];
  return true;
}

function exDisplay(ex){
  if(!ex) return "Exercise";
  const a = (ex.angle && ex.angle!=="None") ? ex.angle+" " : "";
  return `${a}${ex.name} (${ex.equipment})`;
}
function fmtDur(sec){
  sec = Math.max(0, Math.floor(sec));
  const h=Math.floor(sec/3600), m=Math.floor((sec%3600)/60), s=sec%60;
  const mm = (h?String(m).padStart(2,"0"):m);
  return (h?h+":":"") + mm + ":" + String(s).padStart(2,"0");
}
function fmtClock(sec){ const m=Math.floor(sec/60), s=sec%60; return m+":"+String(s).padStart(2,"0"); }
function fmtDate(ts){
  const d=new Date(ts), now=new Date();
  const same = d.toDateString()===now.toDateString();
  const yest = new Date(now-864e5).toDateString()===d.toDateString();
  const t = d.toLocaleTimeString([], {hour:"numeric",minute:"2-digit"});
  if(same) return "Today, "+t;
  if(yest) return "Yesterday, "+t;
  return d.toLocaleDateString([], {weekday:"short",month:"short",day:"numeric",year:(d.getFullYear()!==now.getFullYear()?"numeric":undefined)}) + ", " + t;
}
function timeOf(ts){ return new Date(ts).toLocaleTimeString([], {hour:"numeric",minute:"2-digit"}); }
// most recent logged WORKING sets for this profile + exercise (warmups excluded)
function lastSetsFor(profileId, exerciseId){
  for(let i=S.sessions.length-1;i>=0;i--){
    const s=S.sessions[i];
    if(s.profileId!==profileId) continue;
    const e=s.entries.find(en=>en.exerciseId===exerciseId);
    if(e){ const w=e.sets.filter(st=>!st.warmup); if(w.length) return w; }
  }
  return null;
}

/* ---------- progressive-overload recommendation (Nippard-style) ---------- */
function roundTo(v,step){ return Math.round(v/step)*step; }
// Jump scales with the load: ~2.5% upper / ~3.5% lower-body, rounded to 5 lb,
// never less than the smallest practical plate jump. So 135→+5 but 1080→+40.
function weightIncrement(ex, weight){
  const n=((ex&&ex.name)||"").toLowerCase();
  const lower=/squat|dead|leg press|lunge|hip thrust|rdl|romanian|hack|calf|leg curl|leg ext/.test(n);
  const base = lower ? 10 : 5;
  const pct  = lower ? 0.035 : 0.025;
  const prop = roundTo((Number(weight)||0)*pct, 5);
  return Math.max(base, prop);
}
function workingWeightOf(sets){
  const ws=sets.map(s=>Number(s.weight)||0).filter(w=>w>0);
  if(!ws.length) return 0;
  const cnt={}; ws.forEach(w=>cnt[w]=(cnt[w]||0)+1);
  let best=ws[0], bc=0;
  Object.keys(cnt).forEach(w=>{ if(cnt[w]>bc || (cnt[w]===bc && +w>best)){ best=+w; bc=cnt[w]; } });
  return best;
}
function warmupsFor(w, reps){
  if(!w || w<50) return [];
  return [ {w:roundTo(w*0.5,5), r:reps}, {w:roundTo(w*0.7,5), r:reps} ];
}
// returns {working:[{w,r,rpe}], warmups:[{w,r}], note}
function recommend(pid, exId){
  const ex=exById(exId)||{}; const g=ex.goal||{};
  const repsLow = g.repsLow || g.repsHigh || 8;
  const repsHigh = g.repsHigh || g.repsLow || 12;
  const last=lastSetsFor(pid, exId);
  if(last && last.length){
    const nSets = g.sets || last.length;
    const wWeight = workingWeightOf(last);
    const allHitTop = wWeight>0 && last.every(s=>(Number(s.reps)||0)>=repsHigh);
    const lastRpe = last[last.length-1] ? last[last.length-1].rpe : null;
    let working, note;
    if(allHitTop){
      const inc=weightIncrement(ex, wWeight); const newW=roundTo(wWeight+inc,5);
      working=Array.from({length:nSets},()=>({w:newW, r:repsLow, rpe:g.rpe||null}));
      note=`Earned it — hit ${repsHigh} on every set. Go <b>${newW} lb × ${repsLow}</b> (+${inc}).`;
    }else{
      working=Array.from({length:nSets},(_,i)=>{
        const lr=last[i]?(Number(last[i].reps)||repsLow):repsLow;
        return {w:(wWeight||""), r:Math.min(repsHigh,lr+1), rpe:g.rpe||null};
      });
      const target=working.map(s=>s.r).join("/");
      note=`Beat last time: <b>${wWeight?wWeight+" lb × ":""}${target}</b>${lastRpe?" (last RPE "+lastRpe+")":""}. Add weight once all sets reach ${repsHigh}.`;
    }
    const todayW = (working[0] && working[0].w) ? working[0].w : wWeight;
    return { working, warmups:warmupsFor(todayW,repsLow), note };
  }
  const nSets=g.sets||3;
  return { working:Array.from({length:nSets},()=>({w:"", r:repsLow, rpe:g.rpe||null})), warmups:[],
    note:`First time — aim <b>${repsLow===repsHigh?repsLow:repsLow+"–"+repsHigh} reps</b>, then we'll progress next time.` };
}
function workoutLastDone(workoutId, profileId){
  for(let i=S.sessions.length-1;i>=0;i--){
    const s=S.sessions[i];
    if(s.workoutId===workoutId && s.profileId===profileId) return s;
  }
  return null;
}
function sessionVolume(sess){
  let v=0;
  sess.entries.forEach(en=>en.sets.forEach(st=>{ if(st.warmup) return; v += (Number(st.weight)||0)*(Number(st.reps)||0); }));
  return Math.round(v);
}

/* ============================================================
   LIVE LINK — "working out together" across two phones.
   Each phone publishes its own presence (current exercise, last set,
   rest timer) to the cloud; partners see it live. Dormant w/o Firebase.
   ============================================================ */
let partners=[], partnerTicker=null;
const PRESENCE_TTL=90000; // treat as offline after 90s of no heartbeat
function myPresence(){
  const cur=curProfile();
  if(!S.active){
    return { profileId:S.currentProfileId, name:cur?cur.name:"", color:cur?cur.color:"#888", active:false, updatedAt:Date.now() };
  }
  const a=S.active;
  const ent=a.entries[a.entries.length-1];
  const ex=ent?exById(ent.exerciseId):null;
  let lastSet="", setsDone=0;
  a.entries.forEach(en=>en.sets.forEach(s=>{ if(s.done && !s.warmup){ setsDone++; lastSet=(s.weight||0)+" × "+(s.reps||0); }}));
  const prof=profile(a.profileId)||cur;
  return { profileId:a.profileId, name:prof?prof.name:"", color:prof?prof.color:"#888", active:true,
    workoutId:a.workoutId||null, workoutName:(workoutById(a.workoutId)||{}).name||"Quick Workout", startedAt:a.startedAt,
    exercise:ex?exDisplay(ex):"", lastSet, setsDone, restEndsAt: rest.running?rest.endAt:null, updatedAt:Date.now() };
}
function pushPresence(){ if(window.cloudPushPresence){ try{ window.cloudPushPresence(myPresence()); }catch(e){} } }
// called by the Firebase module with all presence docs
window.onPresence=function(list){
  const now=Date.now();
  partners=(list||[])
    .filter(p=>p && p.active && safeId(p.profileId) && p.profileId!==S.currentProfileId && (now-(p.updatedAt||0)<PRESENCE_TTL))
    .map(p=>({...p, color:safeColor(p.color)}));
  renderPartner();
  if(partners.length && !partnerTicker) partnerTicker=setInterval(renderPartner,1000);
  if(!partners.length && partnerTicker){ clearInterval(partnerTicker); partnerTicker=null; }
};
function renderPartner(){
  const el=document.getElementById("partner"); if(!el) return;
  const now=Date.now();
  const live=partners.filter(p=>now-(p.updatedAt||0)<PRESENCE_TTL);
  if(!live.length){ el.innerHTML=""; el.style.display="none"; if(partnerTicker){ clearInterval(partnerTicker); partnerTicker=null; } return; }
  el.style.display="block";
  el.innerHTML=live.map(p=>{
    const dur=p.startedAt?fmtDur((now-p.startedAt)/1000):"";
    const resting = p.restEndsAt && p.restEndsAt>now;
    const info=[p.workoutName, dur, p.exercise, (!resting&&p.lastSet)?("last "+p.lastSet):""].filter(Boolean).join(" · ");
    const restTxt = resting?`<span class="prest">⏱ ${fmtClock(Math.round((p.restEndsAt-now)/1000))}</span>`:"";
    // offer to JOIN: do the same workout yourself (only if you're not already training)
    const canJoin = !S.active;
    const joinBtn = canJoin ? `<button class="joinbtn" onclick="joinPartner('${safeId(p.workoutId)||''}')">Join</button>` : "";
    return `<div class="partner"><span class="plive" style="background:${safeColor(p.color)}"></span>
      <span class="pname" style="color:${safeColor(p.color)}">${escapeHtml(p.name)}</span>
      <span class="pinfo">${escapeHtml(info)}</span>${restTxt}${joinBtn}</div>`;
  }).join("");
}
// start the same workout your partner is doing (same template, or an empty session)
function joinPartner(workoutId){
  if(S.active){ return; }
  if(workoutId && workoutById(workoutId)) startWorkout(workoutId);
  else startEmptyWorkout();
}
function renderProfiles(){

    <button class="chip ${p.id===S.currentProfileId?'active':''}"

      onclick="switchProfile('${p.id}')" oncontextmenu="return false">

}

  html += `<div class="sub" style="margin:0 2px 14px">Logging as <b style="color:${curProfile().color}">${escapeHtml(curProfile().name)}</b> · weights & history are saved per person</div>`;

    html += `<button class="btn" onclick="startEmptyWorkout()">⚡ Start Empty Workout</button>`;
  }
  html += `<div class="row between" style="margin:20px 2px 8px">
      <div style="font-weight:800;font-size:16px">Templates</div>
      <button class="btn ghost sm" style="width:auto" onclick="newTemplate()">+ New</button></div>`;
  if(S.workouts.length===0){
    html += `<div class="card" style="text-align:center;color:var(--muted)">
      <div style="font-size:34px">📋</div>
      <div style="margin-top:6px">No templates yet.</div>
      <div class="sub" style="margin-top:4px">Make a reusable plan like "Push Day", or just start an empty workout and save it as a template at the end.</div></div>`;

    html += S.workouts.map(w=>{
      const last=workoutLastDone(w.id, S.currentProfileId);
      return `<div class="card tap" onclick="openTemplate('${w.id}')">
        <div class="row between">
          <div style="min-width:0">
            <div class="wname">${escapeHtml(w.name)}</div>
            <div class="meta">${w.exerciseIds.length} exercise${w.exerciseIds.length!==1?'s':''}${last?` · last ${fmtDate(last.endedAt).replace(/,.*/,'')}`:' · not done yet'}</div>
            <div>${w.exerciseIds.slice(0,4).map(id=>`<span class="pill">${escapeHtml(shortName(id))}</span>`).join("")}${w.exerciseIds.length>4?`<span class="pill">+${w.exerciseIds.length-4}</span>`:''}</div>
          </div>
          ${S.active?'':`<button class="btn sm" style="background:var(--accent);width:auto;flex:0 0 auto" onclick="event.stopPropagation();startWorkout('${w.id}')">Start ▶</button>`}
        </div></div>`;
    }).join("");
  }
  return html;
}

    html+=`<div class="card" style="text-align:center;color:var(--muted)">No exercises yet — add the moves for this workout.</div>`;

  html+=`<button class="btn danger" style="margin-top:10px" onclick="deleteWorkout('${id}')">Delete template</button>`;
  return html;
}
function shortName(exId){ const e=exById(exId); if(!e) return "?"; const a=(e.angle&&e.angle!=="None")?e.angle[0]+". ":""; return a+e.name; }

/* ---------- Active workout (logging) ---------- */
function viewActive(){
  const a=S.active;
  if(!a){ route.view="list"; return viewWorkouts(); }
  const w=workoutById(a.workoutId);
  let html = `<div class="stickybar">
    <button class="btn ghost sm" style="width:auto;padding-left:0" onclick="route.view='list';render()">‹ Workouts</button>
    <div class="timerbig" id="sessDur">${fmtDur((Date.now()-a.startedAt)/1000)}</div>
    <button class="btn sm" style="background:var(--good);color:#053;width:auto" onclick="finishWorkout()">Finish</button>
  </div>`;
  html += `<div class="h1" style="margin-bottom:10px">${escapeHtml(w?w.name:"Quick Workout")}</div>`;
  if(a.entries.length===0){
    html += `<div class="card" style="text-align:center;color:var(--muted)">No exercises yet — tap “Add Exercise” to start logging.</div>`;
  }

  a.entries.forEach((en,ei)=>{
    const ex=exById(en.exerciseId);
    const prev=lastSetsFor(a.profileId, en.exerciseId);
    const rec=recommend(a.profileId, en.exerciseId);
    html += `<div class="card">
      <div class="exhead">
        <div><div class="exname">${escapeHtml(ex?ex.name:"Exercise")}</div>
          <div class="exsub">${escapeHtml(ex?[(ex.angle&&ex.angle!=="None")?ex.angle:null, ex.equipment].filter(Boolean).join(" · "):"")}</div></div>
        <div class="row" style="gap:8px">
          <button class="howbtn" onclick="howTo('${en.exerciseId}')">▶ How-to</button>
          <button class="delset" style="font-size:20px" onclick="removeEntry(${ei})">⋯</button>
        </div>
      </div>
      <table class="setgrid"><thead><tr>
        <th class="setno">Set</th><th>Prev</th><th>${S.units.toUpperCase()}</th><th>Reps</th><th>RPE <span class="rpeq" onclick="rpeHelp()">?</span></th><th>✓</th><th></th>
      </tr></thead><tbody>`;
    let wkNo=0, wkIdx=0;
    en.sets.forEach((st,si)=>{
      let label, p;
      if(st.warmup){ label="W"; p="—"; }
      else { wkNo++; label=String(wkNo); const pv=prev&&prev[wkIdx]; p = pv?`${pv.weight||0}×${pv.reps||0}`:"—"; wkIdx++; }
      const phW = (st.recW!=null&&st.recW!=="")? st.recW : "";
      const phR = (st.recR!=null&&st.recR!=="")? st.recR : "";
      const phRpe = (st.recRPE!=null&&st.recRPE!=="")? st.recRPE : "–";
      html += `<tr class="${st.done?'done':''} ${st.warmup?'wu':''}">
        <td class="setno">${label}</td>
        <td class="prevcell">${p}</td>
        <td><input class="inp" inputmode="decimal" value="${st.weight??""}" placeholder="${phW}" data-f="weight" data-e="${ei}" data-s="${si}"></td>
        <td><input class="inp" inputmode="numeric" value="${st.reps??""}" placeholder="${phR}" data-f="reps" data-e="${ei}" data-s="${si}"></td>
        <td><input class="inp rpe" inputmode="decimal" value="${st.rpe??""}" placeholder="${phRpe}" data-f="rpe" data-e="${ei}" data-s="${si}"></td>
        <td><button class="check" onclick="toggleDone(${ei},${si})">${st.done?'✓':''}</button></td>
        <td><button class="delset" onclick="removeSet(${ei},${si})">×</button></td>
      </tr>`;
    });
    html += `</tbody></table>
      ${rec.note?`<div class="recnote"><span>↗</span><span>${rec.note}</span></div>`:""}
      <button class="addset" onclick="addSet(${ei})">+ Add Set</button>
      ${guideBanner(ex)}
    </div>`;
  });

  html += `<button class="btn sec" onclick="pickExerciseActive()">+ Add Exercise</button>`;
  html += `<button class="btn danger" style="margin-top:10px" onclick="cancelWorkout()">Cancel Workout</button>`;
  return html;
}

function viewSessionDetail(id){
  const s=S.sessions.find(x=>x.id===id);
  if(!s){ route.view="list"; return viewHistory(); }
  let html=`<button class="btn ghost sm" style="width:auto;padding-left:0;margin-bottom:6px" onclick="route.view='list';route.id=null;render()">‹ History</button>`;
  html+=`<div class="h1" style="margin-bottom:4px">${escapeHtml(s.workoutName)}</div>`;
  html+=`<div class="sub" style="margin:0 2px 14px">${fmtDate(s.endedAt)}${s.startedAt?` · ${timeOf(s.startedAt)}–${timeOf(s.endedAt)}`:""} · ⏱ ${fmtDur(s.durationSec)} · ${sessionVolume(s).toLocaleString()} ${S.units}</div>`;
  html+=s.entries.map(en=>{
    const e=exById(en.exerciseId);
    return `<div class="card">
      <div class="row between"><div>
        <div class="exname">${escapeHtml(entryName(en))}</div>
        <div class="exsub">${escapeHtml(e?e.equipment:"")}</div></div>
        ${e?`<button class="howbtn" onclick="howTo('${en.exerciseId}')">▶ How-to</button>`:""}
      </div>
      <table class="setgrid" style="margin-top:8px"><thead><tr>
        <th class="setno">Set</th><th>${S.units.toUpperCase()}</th><th>Reps</th><th>RPE</th></tr></thead><tbody>
        ${(function(){let n=0; return en.sets.map(st=>{const lbl=st.warmup?"W":String(++n); return `<tr class="${st.warmup?'wu':''}"><td class="setno">${lbl}</td><td>${st.weight||0}</td><td>${st.reps||0}</td><td>${st.rpe||"–"}</td></tr>`;}).join("");})()}
      </tbody></table></div>`;
  }).join("");
  html+=`<button class="btn danger" onclick="deleteSession('${s.id}')">Delete this session</button>`;
  return html;
}

/* ----- start / run a workout ----- */
function startEmptyWorkout(){
  if(S.active){ if(!confirm("A workout is already in progress. Discard it and start empty?")) return; S.active=null; }
  S.active={ workoutId:null, profileId:S.currentProfileId, startedAt:Date.now(), entries:[] };
  save(); startSessionTimer();
  route.tab="workouts"; route.view="active"; render();
}
function startWorkout(id){
  if(S.active && S.active.workoutId!==id){
    if(!confirm("Another workout is in progress. Discard it and start this one?")) return;
    S.active=null;
  }
  const w=workoutById(id);
  if(!S.active){
    S.active={ workoutId:id, profileId:S.currentProfileId, startedAt:Date.now(),
      entries: w.exerciseIds.map(exId=>({ exerciseId:exId, sets: seedSets(exId) })) };
    save();
  }
  startSessionTimer();
  route.tab="workouts"; route.view="active"; render();
}
// seed today's sets as warmups + working sets, with recommended values shown as grey overlays
function seedSets(exId){
  const pid = S.active ? S.active.profileId : S.currentProfileId;   // use the active session's profile
  const rec = recommend(pid, exId);
  const sets=[];
  rec.warmups.forEach(ws=> sets.push({weight:"",reps:"",rpe:"",done:false,warmup:true,recW:ws.w,recR:ws.r}));
  rec.working.forEach(s=> sets.push({weight:"",reps:"",rpe:"",done:false,recW:(s.w===""?null:s.w),recR:s.r,recRPE:s.rpe}));
  if(!sets.length) sets.push({weight:"",reps:"",rpe:"",done:false});
  return sets;
}

function addSet(ei){
  const sets=S.active.entries[ei].sets;
  const lastWk=[...sets].reverse().find(s=>!s.warmup) || sets[sets.length-1];
  sets.push({weight:"",reps:"",rpe:"",done:false,
    recW: lastWk?lastWk.recW:null, recR: lastWk?lastWk.recR:null, recRPE: lastWk?lastWk.recRPE:null});
  save(); render();
}
function removeSet(ei,si){ S.active.entries[ei].sets.splice(si,1); save(); render(); }
function removeEntry(ei){
  const ex=exById(S.active.entries[ei].exerciseId);
  if(!confirm(`Remove ${ex?ex.name:'exercise'} from this workout?`)) return;
  S.active.entries.splice(ei,1); save(); render();
}
function toggleDone(ei,si){
  const st=S.active.entries[ei].sets[si];
  st.done=!st.done;
  if(st.done){
    // accept the grey recommendation if the user didn't type their own
    if((st.weight===""||st.weight==null) && st.recW!=null && st.recW!=="") st.weight=st.recW;
    if((st.reps===""||st.reps==null) && st.recR!=null && st.recR!=="") st.reps=st.recR;
    startRest(S.restDefault);
  }
  save(); render(); pushPresence();
}

/* live update of weight/reps/rpe without re-render (keeps keyboard focus) */
document.addEventListener("input",(e)=>{

    const {f,e:ei,s:si}=t.dataset;

});

// live type-ahead: show saved exercises that match as you type
function onExType(){
  const input=document.getElementById("exname");

  const lib=S.exercises.slice().sort((a,b)=>a.name.localeCompare(b.name));
  const matches=(q? lib.filter(e=>exDisplay(e).toLowerCase().includes(q)) : lib).slice(0,8);
  const exact = q && lib.some(e=>e.name.toLowerCase()===q);
  const sug=document.getElementById("suggest");
  if(sug){
    sug.innerHTML = matches.length
      ? `<div class="field"><label>${q?"Matches in your library — tap to add":"Your saved exercises — tap to add"}</label>

}

/* ----- finish / cancel ----- */
function finishWorkout(){
  const a=S.active;
  if(!a){ return; }
  // keep only entries with at least one logged set (any weight or reps entered or marked done)
  const entries=a.entries.map(en=>({
    exerciseId:en.exerciseId,
    sets:en.sets.filter(s=>s.done || s.weight!=="" || s.reps!=="")
              .map(s=>{ const o={weight:num(s.weight),reps:num(s.reps),rpe:s.rpe===""?null:num(s.rpe)}; if(s.warmup) o.warmup=true; return o; })
  })).filter(en=>en.sets.length);
  if(entries.length===0){
    if(!confirm("No sets logged. Discard this workout?")) return;
    cancelWorkout(true); return;
  }
  const w=workoutById(a.workoutId);
  const sess={ id:uid(), workoutId:a.workoutId, workoutName:w?w.name:"Quick Workout",
    profileId:a.profileId, startedAt:a.startedAt, endedAt:Date.now(),
    durationSec:Math.round((Date.now()-a.startedAt)/1000), entries };
  S.sessions.push(sess);
  const sourceId=a.workoutId;
  S.active=null; stopSessionTimer(); stopRest(); save();
  maybeOfferTemplate(sess, sourceId);
}

/* After finishing, ask whether to save/update a template */
let pendingTpl=null;
function maybeOfferTemplate(sess, sourceId){
  const exIds=[...new Set(sess.entries.map(e=>e.exerciseId))];
  pendingTpl={ exIds, sourceId, sessId:sess.id, name:sess.workoutName };
  if(sourceId){
    const w=workoutById(sourceId);
    const same = w && w.exerciseIds.length===exIds.length && exIds.every(id=>w.exerciseIds.includes(id));
    if(same){ pendingTpl=null; gotoSession(sess.id); return; }   // unchanged template — nothing to ask
    openModal(`<h3>Save changes to template?</h3>
      <div class="muted" style="margin:-4px 0 14px">This workout's exercises differ from your “${escapeHtml(w?w.name:"template")}” template.</div>
      <button class="btn" onclick="tplUpdate()">Update “${escapeHtml(w?w.name:"template")}”</button>
      <button class="btn sec" style="margin-top:10px" onclick="tplSaveNewPrompt()">Save as a new template</button>
      <button class="btn ghost" style="margin-top:6px" onclick="tplDismiss()">Keep template unchanged</button>`);
  }else{
    openModal(`<h3>Save as a template?</h3>
      <div class="muted" style="margin:-4px 0 14px">Save this workout so you can start it again next time.</div>
      <div class="field"><label>Template name</label><input class="text" id="tplname" value="${escapeHtml(sess.workoutName==="Quick Workout"?"":sess.workoutName)}" placeholder="e.g. Push Day"></div>

  }
}
function tplUpdate(){ const w=workoutById(pendingTpl.sourceId); if(w){ w.exerciseIds=pendingTpl.exIds.slice(); save(); } tplDone(); }

/* ----- "How-to" video + RPE help ----- */
function howTo(exId){
  const ex=exById(exId); if(!ex) return;
  const terms=[ (ex.angle&&ex.angle!=="None")?ex.angle:"", ex.name, ex.equipment, "proper form" ].filter(Boolean);
  const q=encodeURIComponent("how to "+terms.join(" "));
  const url="https://www.youtube.com/results?search_query="+q;
  // Open via a real anchor click so an iOS Home-Screen app hands off to Safari / the
  // YouTube app instead of navigating its own window (which left a blank/stuck page).
  const a=document.createElement("a");
  a.href=url; a.target="_blank"; a.rel="noopener noreferrer";
  document.body.appendChild(a); a.click(); a.remove();
}
/* ----- per-exercise GOAL (target sets/reps/RPE + notes); shows everywhere the exercise is used ----- */
function goalText(g){
  if(!g) return "";
  const parts=[];
  if(g.sets) parts.push(g.sets+" set"+(g.sets>1?"s":""));
  const reps = (g.repsLow&&g.repsHigh) ? (g.repsLow===g.repsHigh? ""+g.repsLow : g.repsLow+"–"+g.repsHigh)
             : (g.repsLow||g.repsHigh||"");
  if(reps) parts.push("× "+reps+" reps");
  let s=parts.join(" ");
  if(g.rpe) s += (s?" @ ":"")+"RPE "+g.rpe;
  return s;
}
function guideBanner(ex){
  if(!ex) return "";
  const g=ex.goal;
  const main=goalText(g);
  const notes=(g&&g.notes)||ex.guide||"";   // ex.guide kept for backward-compat
  if(main || notes){
    return `<div class="guide" onclick="editGuide('${ex.id}')">
      <span class="ic">🎯</span>
      <span>${main?`<b>${escapeHtml(main)}</b>`:""}${main&&notes?"<br>":""}${notes?`<span class="muted">${escapeHtml(notes)}</span>`:""}</span>
      <span class="edit">edit</span></div>`;
  }
  return `<div class="guide empty" onclick="editGuide('${ex.id}')"><span class="ic">＋</span><span>Set a goal (sets · reps · RPE)</span></div>`;
}
function stepper(id, val, min, max, step){
  const im = step<1 ? "decimal" : "numeric";
  return `<div class="stepper">
    <button type="button" onclick="bump('${id}',-1,${min},${max},${step})">−</button>
    <input id="${id}" class="stepin" inputmode="${im}" value="${(val!=null&&val!=="")?val:""}" placeholder="–">
    <button type="button" onclick="bump('${id}',1,${min},${max},${step})">+</button></div>`;
}
function bump(id, dir, min, max, step){
  const el=document.getElementById(id); if(!el) return;
  step=step||1;
  let v=parseFloat(el.value);
  if(isNaN(v)) v=0;
  v=v+dir*step;
  if(min!=null) v=Math.max(min,v);
  if(max!=null) v=Math.min(max,v);
  v=Math.round(v/step)*step;
  el.value = Number.isInteger(v)? String(v) : v.toFixed(1);
}
function editGuide(exId){
  const ex=exById(exId); if(!ex) return;
  const g=ex.goal||{};
  openModal(`<h3>Goal · ${escapeHtml(ex.name)}</h3>
    <div class="muted" style="margin:-4px 0 16px">Your target for this exercise — shows every time you do it (for both of you). Leave any blank.</div>
    <div class="gline"><span class="lbl">Sets</span>${stepper("gsets",g.sets,0,99,1)}</div>
    <div class="gline"><span class="lbl">Reps</span>${stepper("grmin",g.repsLow,0,99,1)}<span class="rangeto">to</span>${stepper("grmax",g.repsHigh,0,99,1)}</div>
    <div class="gline"><span class="lbl">Target RPE</span>${stepper("grpe",g.rpe,1,10,0.5)}</div>
    <div class="field"><label>Notes (optional)</label>
      <textarea class="text" id="gnotes" placeholder="e.g. pause at chest, controlled tempo">${escapeHtml((g.notes)||ex.guide||"")}</textarea></div>
    <button class="btn" onclick="saveGuide('${exId}')">Save goal</button>
    ${(ex.goal||ex.guide)?`<button class="btn ghost" style="margin-top:6px" onclick="saveGuide('${exId}',true)">Clear goal</button>`:""}`);
}
function saveGuide(exId, clear){
  const ex=exById(exId); if(!ex) return;
  if(clear){ ex.goal=null; ex.guide=""; save(); closeModal(); render(); return; }
  const gv=id=>{ const el=document.getElementById(id); if(!el||el.value==="") return null; const v=parseFloat(el.value); return isNaN(v)?null:v; };
  const notes=(document.getElementById("gnotes").value||"").trim();
  const goal={ sets:gv("gsets"), repsLow:gv("grmin"), repsHigh:gv("grmax"), rpe:gv("grpe"), notes };
  const empty = goal.sets==null && goal.repsLow==null && goal.repsHigh==null && goal.rpe==null && !notes;
  ex.goal = empty ? null : goal;
  ex.guide = "";
  save(); closeModal(); render();
}
function rpeHelp(){
  openModal(`<h3>RPE — effort guide</h3>
    <div class="muted" style="margin:-4px 0 12px">RPE = how hard a set felt. After your last rep, ask: <b>how many more reps could I have done?</b> (that's "reps in reserve"). Log the matching number.</div>
    <table class="rpetable"><tbody>
      <tr><td class="n">10</td><td><b>All-out.</b> Couldn't do another rep (0 in reserve).</td></tr>
      <tr><td class="n">9.5</td><td>Maybe a touch more weight, but no more reps.</td></tr>
      <tr><td class="n">9</td><td><b>1 rep</b> left in the tank.</td></tr>

      <tr><td class="n">7</td><td><b>3 reps</b> left. Comfortable hard set.</td></tr>
      <tr><td class="n">5–6</td><td><b>4–6 reps</b> left. Light / warm-up territory.</td></tr>
      <tr><td class="n">1–4</td><td>Very easy. Mostly for warm-ups or technique.</td></tr>
    </tbody></table>
    <div class="muted" style="margin:0 0 14px">Tip: most working sets sit at <b>7–9</b>. Leave RPE blank if you're not sure.</div>
    <button class="btn" onclick="closeModal()">Got it</button>`);
}

/* ============================================================
   TIMERS
   ============================================================ */
let sessTimer=null, presHb=null;
function startSessionTimer(){ stopSessionTimer(); sessTimer=setInterval(tickSession,1000); pushPresence(); presHb=setInterval(pushPresence,20000); }
function stopSessionTimer(){ if(sessTimer) clearInterval(sessTimer); sessTimer=null; if(presHb) clearInterval(presHb); presHb=null; }
function tickSession(){
  if(!S.active){ stopSessionTimer(); return; }
  const el=document.getElementById("sessDur");
  if(el) el.textContent=fmtDur((Date.now()-S.active.startedAt)/1000);
  const rd=document.getElementById("resumeDur");
  if(rd) rd.textContent="In progress · "+fmtDur((Date.now()-S.active.startedAt)/1000);
}

let rest={running:false,endAt:0,timer:null};
// iOS only allows audio that's unlocked by a user gesture. The rest beep fires from a
// timer, so prime/resume the AudioContext here (startRest runs from the ✓ tap).
function unlockAudio(){
  try{
    beepCtx = beepCtx || new (window.AudioContext||window.webkitAudioContext)();
    if(beepCtx.state==="suspended") beepCtx.resume();
  }catch(e){}
}
function startRest(sec){
  stopRest();
  unlockAudio();
  rest.running=true; rest.endAt=Date.now()+sec*1000;
  rest.timer=setInterval(tickRest,250);
  renderRest(); tickRest(); pushPresence();
}
function adjustRest(delta){
  if(!rest.running){ startRest(Math.max(15,S.restDefault+delta)); return; }
  rest.endAt+=delta*1000;
  if(rest.endAt<=Date.now()) stopRest();
  tickRest();
}
function stopRest(){ rest.running=false; if(rest.timer)clearInterval(rest.timer); rest.timer=null; renderRest(); pushPresence(); }
function tickRest(){
  const left=Math.round((rest.endAt-Date.now())/1000);
  const bar=document.getElementById("restbar"), t=document.getElementById("restTime");
  if(left<=0){ if(t)t.textContent="0:00"; if(bar)bar.classList.add("ring"); ding(); stopRest(); return; }
  if(t) t.textContent=fmtClock(left);
}
function renderRest(){
  const wrap=document.getElementById("rest");
  const show = rest.running && route.view==="active";
  wrap.style.display = show?"block":"none";
  if(show){ document.getElementById("restbar").classList.remove("ring"); }
}
function ding(){
  try{
    if(navigator.vibrate) navigator.vibrate([180,90,180]);
    beepCtx = beepCtx || new (window.AudioContext||window.webkitAudioContext)();
    if(beepCtx.state==="suspended") beepCtx.resume();
    [0,0.18,0.36].forEach((d,i)=>{
      const o=beepCtx.createOscillator(), g=beepCtx.createGain();
      o.frequency.value= i===2?1040:780; o.type="sine";
      o.connect(g); g.connect(beepCtx.destination);
      const tt=beepCtx.currentTime+d;
      g.gain.setValueAtTime(0.0001,tt); g.gain.exponentialRampToValueAtTime(0.4,tt+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001,tt+0.15);
      o.start(tt); o.stop(tt+0.16);
    });
  }catch(e){}
}
// rest bar buttons
document.getElementById("restbar").addEventListener("click",(e)=>{
  const v=e.target.getAttribute("data-rest"); if(!v) return;
  if(v==="skip") stopRest();
  else if(v==="-15") adjustRest(-15);
  else if(v==="+15") adjustRest(15);
});

<!-- ============================================================
     Firebase cloud sync (loads only if firebase-config.js is filled in).
     Uses the Firestore modular SDK from the official CDN. One shared
     document ("shared/data") holds both people's data.
     ============================================================ -->
<script type="module">
(async function(){
  const cfg = window.FIREBASE_CONFIG;
  if(!cfg || !cfg.apiKey){ return; }              // not configured yet → stay local-only
  try{
    const { initializeApp } = await import("https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js");
    const { getFirestore, doc, collection, onSnapshot, setDoc } =
      await import("https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js");
    const app = initializeApp(cfg);
    const db  = getFirestore(app);
    const ref = doc(db, "shared", "data");
    window.cloudPush = (data)=> setDoc(ref, data);  // full overwrite; merge happens on read
    onSnapshot(ref,
      (snap)=>{ if(snap.exists() && window.onCloudData) window.onCloudData(snap.data()); },
      (err)=>{ console.warn("sync error", err); if(window.setSyncErr) window.setSyncErr(); }
    );
    // LIVE LINK presence: one doc per profile, everyone watches the collection
    window.cloudPushPresence = (p)=> setDoc(doc(db, "presence", p.profileId), p);
    onSnapshot(collection(db, "presence"),
      (snap)=>{ const list=[]; snap.forEach(d=>list.push(d.data())); if(window.onPresence) window.onPresence(list); },
      (err)=>{ console.warn("presence error", err); }
    );
    if(window.onCloudReady) window.onCloudReady();
  }catch(e){ console.warn("Firebase init failed", e); if(window.setSyncErr) window.setSyncErr(); }
})();
</script>
