// seed today's sets as warmups + working sets, with recommended values shown as grey overlays
function seedSets(exId){
  const pid = S.active ? S.active.profileId : S.currentProfileId;   // use the active session's profile
  const rec = recommend(pid, exId);
  const sets=[];
  rec.warmups.forEach(ws=> sets.push({weight:"",reps:"",rpe:"",done:false,warmup:true,recW:ws.w,recR:ws.r}));
  rec.working.forEach(s=> sets.push({weight:"",reps:"",rpe:"",done:false,recW:(s.w===""?null:s.w),recR:s.r,recRPE:s.rpe}));
  if(!sets.length) sets.push({weight:"",reps:"",rpe:"",done:false});
  return sets;
}

/* Ghosts carry forward, climbing. Once you log a working set, every later untouched set
   ghosts YOUR numbers rather than the pre-workout recommendation — same reps, one ramp step
   heavier — so you type 145 × 10 once and tap ✓ down the rest of the column at 155, 165.
   Each step is measured off the set before it, so overriding one set re-bases the rest.
   Warmups have their own 50/70% ramp and neither carry nor climb.
   Returns one {w,r,rpe} per set, in set order. */
function ghostsFor(en){
  const ex=exById(en&&en.exerciseId);
  let cw=null, cr=null;   // carried from the last working set you filled in
  return ((en&&en.sets)||[]).map(st=>{
    if(st.warmup) return {w:st.recW, r:st.recR, rpe:st.recRPE};
    const g={ w:(cw!=null?cw:st.recW), r:(cr!=null?cr:st.recR), rpe:st.recRPE };
    const w=(st.weight!=null&&st.weight!=="")?st.weight:g.w;
    const r=(st.reps!=null&&st.reps!=="")?st.reps:g.r;
    if(w!=null && w!==""){
      const nw=Number(w)||0;
      cw = nw>0 ? roundTo(nw+rampIncrement(ex,nw),5) : w;   // bodyweight/0 carries flat
    }
    if(r!=null && r!=="") cr=r;
    return g;
  });
}
/* repaint the carried ghosts in place — typing must not re-render, or the keyboard drops */
function refreshGhosts(ei){
  const en=S.active&&S.active.entries[ei]; if(!en) return;
  const g=ghostsFor(en);
  document.querySelectorAll(`.inp[data-e="${ei}"]`).forEach(inp=>{
    const gh=g[+inp.dataset.s]; if(!gh) return;
    if(inp.dataset.f==="weight")    inp.placeholder=(gh.w!=null&&gh.w!=="")?gh.w:"";
    else if(inp.dataset.f==="reps") inp.placeholder=(gh.r!=null&&gh.r!=="")?gh.r:"";
  });
}

function addSet(ei){
  const sets=S.active.entries[ei].sets;
  const lastWk=[...sets].reverse().find(s=>!s.warmup) || sets[sets.length-1];
  sets.push({weight:"",reps:"",rpe:"",done:false,
    recW: lastWk?lastWk.recW:null, recR: lastWk?lastWk.recR:null, recRPE: lastWk?lastWk.recRPE:null});
  save(); render();
}
function removeSet(ei,si){ S.active.entries[ei].sets.splice(si,1); save(); render(); }
function removeEntry(ei){
  const ex=exById(S.active.entries[ei].exerciseId);
  if(!confirm(`Remove ${ex?ex.name:'exercise'} from this workout?`)) return;
  const goneId=S.active.entries[ei].exerciseId;
  S.active.entries.splice(ei,1);
  ssNormalizeActive();                   // its superset may now be down to one exercise
  S.active.removed=S.active.removed||{};
  S.active.removed[goneId]=Date.now();   // tombstone so the removal reaches your partner
  save(); closeModal(); render();
  markListChanged();

function toggleDone(ei,si){
  stopAlertRepeat();
  const en=S.active.entries[ei];
  const st=en.sets[si];
  st.done=!st.done;
  if(st.done){
    // accept the grey ghost if the user didn't type their own — the CARRIED one,
    // so ✓ commits what you did on the earlier sets, not the stale recommendation
    const gh=ghostsFor(en)[si];
    if((st.weight===""||st.weight==null) && gh.w!=null && gh.w!=="") st.weight=gh.w;
    if((st.reps===""||st.reps==null) && gh.r!=null && gh.r!=="") st.reps=gh.r;
    /* Superset: you're not resting yet — you're walking to the next exercise. Warmups
       ramp on their own, so they always take the normal rest. */
    restExId = en.exerciseId;               // names the rest on the lock screen / banner
    const r = st.warmup ? null : activeRuns()[ei];
    if(r && !r.last){
      const nx=S.active.entries[ei+1], nex=nx?exById(nx.exerciseId):null;
      restLabel = `🔗 Superset ${r.letter} — next: ${nex?nex.name:"next exercise"}`;
      const s=ssRest();
      if(s>0) startRest(s); else stopRest();
    }else{
      restLabel = "";
      startRest(S.restDefault);
    }
  }
  save(); render(); pushPresence();
}

// add the whole group at once, sharing one group id so they're linked from the first set
function addSupersetSelection(){
  if(pickSsSel.length<2) return;
  const gid=uid();
  if(pickTarget.type==="template"){
    const w=workoutById(pickTarget.id);
    if(w){
      w.ss=w.ss||{};
      pickSsSel.forEach(id=>{ if(!w.exerciseIds.includes(id)) w.exerciseIds.push(id); w.ss[id]=gid; });
      ssNormalizeTpl(w);
    }
    pickSs=false; pickSsSel=[]; save(); closeModal(); render(); return;
  }
  if(!S.active){ alert("Start a workout first."); return; }
  const fresh=pickSsSel.filter(id=>!S.active.entries.some(en=>en.exerciseId===id));
  fresh.forEach(id=>{ if(S.active.removed) delete S.active.removed[id]; });
  // already-in-the-session picks just join the group where they are
  pickSsSel.forEach(id=>{ const en=S.active.entries.find(e=>e.exerciseId===id); if(en) en.ss=gid; });
  S.active.entries.unshift(...fresh.map(id=>({exerciseId:id, sets:seedSets(id), addedAt:Date.now(), ss:gid})));
  ssNormalizeActive();
  pendingScroll=0; pickSs=false; pickSsSel=[];
  save(); closeModal(); render(); markListChanged();
}
function libRow(ex){

    <div class="eq">${[(ex.angle&&ex.angle!=="None")?ex.angle:null,ex.equipment,isAssisted(ex)?"assisted":null].filter(Boolean).join(" · ")}</div></div>

}
// live type-ahead: show saved exercises that match as you type
function onExType(){
  const input=document.getElementById("exname");

  const q=raw.toLowerCase(), k=exKey(raw);
  const lib=S.exercises.slice().sort((a,b)=>a.name.localeCompare(b.name));
  // match on the normalized key too, so "benchpress" / "bench presses" still find Bench Press
  const matches=(q? lib.filter(e=>exDisplay(e).toLowerCase().includes(q) || exKey(e.name).includes(k)) : lib).slice(0,8);
  const dupe = raw ? findExercise(raw, selected("equipOpts")||"Barbell", selected("angleOpts")||"None") : null;
  const sug=document.getElementById("suggest");
  if(sug){
    sug.innerHTML = matches.length
      ? `<div class="field"><label>${q?"Matches in your library — tap to add":"Your saved exercises — tap to add"}</label>
          <div class="liblist">${matches.map(libRow).join("")}</div></div>`
      : (q?`<div class="muted" style="margin:-2px 2px 14px">No saved match — set angle &amp; equipment below, then add it as new.</div>`:"");
  }
  // "Assisted Pull Up" pre-selects Assisted as you type — until you pick for yourself
  const ao=document.getElementById("assistOpts");
  if(ao && !ao.dataset.touched){
    const want = looksAssisted(raw) ? "Assisted" : "Standard";
    ao.querySelectorAll(".opt").forEach(o=>o.classList.toggle("on", o.dataset.v===want));
  }
  const btn=document.getElementById("createBtn");

           : `+ ${verb} “${titleCaseName(raw)}” as new`;
}
function pick(btn,group){

  if(group==="assistOpts"){ const ao=document.getElementById("assistOpts"); if(ao) ao.dataset.touched="1"; }

function selected(group){ const el=document.querySelector(`#${group} .opt.on`); return el?el.dataset.v:null; }

function addExistingExercise(exId){
  if(pickTarget.type==="template"){
    const w=workoutById(pickTarget.id);
    if(w && !w.exerciseIds.includes(exId)) w.exerciseIds.push(exId);
    save(); closeModal(); render(); return;
  }
  if(!S.active){ alert("Start a workout first."); return; }
  if(S.active.entries.some(en=>en.exerciseId===exId)){ closeModal(); render(); return; }  // already in this session
  S.active.entries.unshift({exerciseId:exId, sets:seedSets(exId), addedAt:Date.now()});
  if(S.active.removed) delete S.active.removed[exId];   // re-adding clears my tombstone
  pendingScroll=0;                 // it's the top card now — land on it, don't hunt for it
  save(); closeModal(); render();

function createAndAddExercise(){
  const name=(document.getElementById("exname").value||"").trim();

  const equipment=selected("equipOpts")||"Barbell", angle=selected("angleOpts")||"None";
  // "bench press" when Bench Press already exists → reuse it, don't fork the library
  const existing=findExercise(name, equipment, angle);
  const land = id => { if(pickSs){ const i=document.getElementById("exname"); if(i) i.value=""; ssPickToggle(id); } else addExistingExercise(id); };
  if(existing){ land(existing.id); return; }
  const ex={id:uid(),name:canonicalExName(name),equipment,angle,goal:null,
            assisted: selected("assistOpts")==="Assisted"};
  S.exercises.push(ex);

/* ----- finish / cancel ----- */
function finishWorkout(){
  const a=S.active;
  if(!a){ return; }
  // keep only entries with at least one logged set (any weight or reps entered or marked done)
  const entries=a.entries.map(en=>({
    exerciseId:en.exerciseId,
    ss:en.ss||null,                  // keep the superset grouping in History
    sets:en.sets.filter(s=>s.done || s.weight!=="" || s.reps!=="")
              .map(s=>{ const o={weight:num(s.weight),reps:num(s.reps),rpe:s.rpe===""?null:num(s.rpe)}; if(s.warmup) o.warmup=true; return o; })
  })).filter(en=>en.sets.length);
  if(entries.length===0){
    if(!confirm("No sets logged. Discard this workout?")) return;
    cancelWorkout(true); return;
  }
  const w=workoutById(a.workoutId);
  const sess={ id:uid(), workoutId:a.workoutId, workoutName:activeName(a),
    profileId:a.profileId, startedAt:a.startedAt, endedAt:Date.now(),
    durationSec:Math.round((Date.now()-a.startedAt)/1000), entries };
  S.sessions.push(sess);
  const sourceId=a.workoutId, wasJoint=a.joint;
  S.active=null; stopSessionTimer(); stopRest(); save();
  if(wasJoint) endPlan();
  maybeOfferTemplate(sess, sourceId);
}

/* After finishing, ask whether to save/update a template */
let pendingTpl=null;
function maybeOfferTemplate(sess, sourceId){
  const exIds=[...new Set(sess.entries.map(e=>e.exerciseId))];
  const ss={};
  sess.entries.forEach(e=>{ if(e.ss) ss[e.exerciseId]=e.ss; });
  pendingTpl={ exIds, ss, sourceId, sessId:sess.id, name:sess.workoutName };
  if(sourceId){
    const w=workoutById(sourceId);
    const same = w && w.exerciseIds.length===exIds.length && exIds.every(id=>w.exerciseIds.includes(id))
      && exIds.every(id=>(ss[id]||null)===((w.ss&&w.ss[id])||null));   // regrouping counts as a change
    if(same){ pendingTpl=null; gotoSession(sess.id); return; }   // unchanged template — nothing to ask
    openModal(`<h3>Save changes to template?</h3>
      <div class="muted" style="margin:-4px 0 14px">This workout's exercises differ from your “${escapeHtml(w?w.name:"template")}” template.</div>
      <button class="btn" onclick="tplUpdate()">Update “${escapeHtml(w?w.name:"template")}”</button>
      <button class="btn sec" style="margin-top:10px" onclick="tplSaveNewPrompt()">Save as a new template</button>
      <button class="btn ghost" style="margin-top:6px" onclick="tplDismiss()">Keep template unchanged</button>`);
  }else{
    openModal(`<h3>Save as a template?</h3>
      <div class="muted" style="margin:-4px 0 14px">Save this workout so you can start it again next time.</div>
      <div class="field"><label>Template name</label><input class="text" id="tplname" value="${escapeHtml(isAutoName(sess.workoutName)?"":sess.workoutName)}" placeholder="e.g. Push Day"></div>
      <button class="btn" onclick="tplSaveNew()">Save template</button>
      <button class="btn ghost" style="margin-top:6px" onclick="tplDismiss()">No thanks</button>`);
    setTimeout(()=>document.getElementById("tplname")?.focus(),60);
  }
}
function tplUpdate(){
  const w=workoutById(pendingTpl.sourceId);
  if(w){ w.exerciseIds=pendingTpl.exIds.slice(); w.ss=tplSsFromPending(); ssNormalizeTpl(w); save(); }
  tplDone();
}
function tplSsFromPending(){
  const ss=pendingTpl.ss||{};
  return Object.keys(ss).length ? {...ss} : null;
}
function tplSaveNewPrompt(){
  openModal(`<h3>Name your template</h3>
    <div class="field"><label>Template name</label><input class="text" id="tplname" value="${escapeHtml(isAutoName(pendingTpl.name)?"":pendingTpl.name)}" placeholder="e.g. Push Day"></div>
    <button class="btn" onclick="tplSaveNew()">Save template</button>`);

}
function tplSaveNew(){
  const el=document.getElementById("tplname");
  const nm=((el?el.value:pendingTpl.name)||"Workout").trim()||"Workout";
  const w={ id:uid(), name:nm, exerciseIds:pendingTpl.exIds.slice(), ss:tplSsFromPending(), createdAt:Date.now() };

}
function tplDismiss(){ tplDone(); }
function tplDone(){ const sid=pendingTpl?pendingTpl.sessId:null; pendingTpl=null; closeModal(); gotoSession(sid); }
function gotoSession(sid){ route.tab="history"; route.view= sid?"session":"list"; route.id=sid; render(); }
/* Throwing away a live session is unrecoverable, and the button for it sits at the
   bottom of a list you're scrolling with sweaty hands mid-set. So it takes a
   deliberate press-and-hold, never a single tap on a native confirm(). */
function loggedSetCount(a){
  if(!a) return 0;
  return a.entries.reduce((n,en)=>n+en.sets.filter(s=>s.done||s.weight!==""||s.reps!=="").length,0);
}
function confirmDiscard(opts, onYes){
  const {title, body, action="Hold to discard"} = opts;
  openModal(`<h3>${escapeHtml(title)}</h3>
    <div class="muted" style="margin:-4px 0 16px">${body}</div>
    <button class="holdbtn" id="holdBtn"><span class="fill"></span><span class="lbl">${escapeHtml(action)}</span></button>
    <div class="holdhint">Press and hold for a second</div>
    <button class="btn sec" style="margin-top:12px" onclick="closeModal()">Keep workout</button>`);
  const b=document.getElementById("holdBtn"); if(!b) return;
  let t=null;
  const stop=()=>{ if(t){ clearTimeout(t); t=null; } b.classList.remove("arm"); };
  const start=(e)=>{
    e.preventDefault();
    if(t) return;
    b.classList.add("arm");
    t=setTimeout(()=>{ t=null; if(navigator.vibrate) navigator.vibrate(30); closeModal(); onYes(); }, 1100);
  };
  b.addEventListener("pointerdown",start);
  ["pointerup","pointercancel","pointerleave"].forEach(ev=>b.addEventListener(ev,stop));
}
function cancelWorkout(silent){
  const a=S.active;
  if(!silent){
    const n=loggedSetCount(a);
    return confirmDiscard({
      title:"Discard this workout?",
      body: n ? `<b>${n} logged set${n===1?"":"s"}</b> will be thrown away. Nothing is saved to History.`
              : "Nothing will be saved to History.",
      action:"Hold to discard"
    }, ()=>cancelWorkout(true));
  }
  const wasJoint = S.active && S.active.joint;
  S.active=null; stopSessionTimer(); stopRest(); save();
  if(wasJoint) endPlan();
  route.tab="workouts"; route.view="list"; render();
}

/* ----- "How-to" video + RPE help ----- */
function howTo(exId){
  const ex=exById(exId); if(!ex) return;
  const terms=[ (ex.angle&&ex.angle!=="None")?ex.angle:"", ex.name, ex.equipment, "proper form" ].filter(Boolean);
  const q=encodeURIComponent("how to "+terms.join(" "));
  const url="https://www.youtube.com/results?search_query="+q;
  // Open via a real anchor click so an iOS Home-Screen app hands off to Safari / the
  // YouTube app instead of navigating its own window (which left a blank/stuck page).
  const a=document.createElement("a");
  a.href=url; a.target="_blank"; a.rel="noopener noreferrer";
  document.body.appendChild(a); a.click(); a.remove();
}
/* ----- per-exercise GOAL (target sets/reps/RPE + notes); shows everywhere the exercise is used ----- */
function goalText(g){
  if(!g) return "";
  const parts=[];
  if(g.sets) parts.push(g.sets+" set"+(g.sets>1?"s":""));
  const reps = (g.repsLow&&g.repsHigh) ? (g.repsLow===g.repsHigh? ""+g.repsLow : g.repsLow+"–"+g.repsHigh)
             : (g.repsLow||g.repsHigh||"");
  if(reps) parts.push("× "+reps+" reps");
  let s=parts.join(" ");
  if(g.rpe) s += (s?" @ ":"")+"RPE "+g.rpe;
  return s;
}
function guideBanner(ex){
  if(!ex) return "";
  const g=ex.goal;
  const main=goalText(g);
  const notes=(g&&g.notes)||ex.guide||"";   // ex.guide kept for backward-compat
  if(main || notes){
    return `<div class="guide" onclick="editGuide('${ex.id}')">
      <span class="ic">🎯</span>
      <span>${main?`<b>${escapeHtml(main)}</b>`:""}${main&&notes?"<br>":""}${notes?`<span class="muted">${escapeHtml(notes)}</span>`:""}</span>
      <span class="edit">edit</span></div>`;
  }
  return `<div class="guide empty" onclick="editGuide('${ex.id}')"><span class="ic">＋</span><span>Set a goal (sets · reps · RPE)</span></div>`;
}
function stepper(id, val, min, max, step){
  const im = step<1 ? "decimal" : "numeric";
  return `<div class="stepper">
    <button type="button" onclick="bump('${id}',-1,${min},${max},${step})">−</button>
    <input id="${id}" class="stepin" inputmode="${im}" value="${(val!=null&&val!=="")?val:""}" placeholder="–">
    <button type="button" onclick="bump('${id}',1,${min},${max},${step})">+</button></div>`;
}
function bump(id, dir, min, max, step){
  const el=document.getElementById(id); if(!el) return;
  step=step||1;
  let v=parseFloat(el.value);
  if(isNaN(v)) v=0;
  v=v+dir*step;
  if(min!=null) v=Math.max(min,v);
  if(max!=null) v=Math.min(max,v);
  v=Math.round(v/step)*step;
  el.value = Number.isInteger(v)? String(v) : v.toFixed(1);
}
function editGuide(exId){
  const ex=exById(exId); if(!ex) return;
  const g=ex.goal||{};
  openModal(`<h3>Goal · ${escapeHtml(ex.name)}</h3>
    <div class="muted" style="margin:-4px 0 16px">Your target for this exercise — shows every time you do it (for both of you). Leave any blank.</div>
    <div class="gline"><span class="lbl">Sets</span>${stepper("gsets",g.sets,0,99,1)}</div>
    <div class="gline"><span class="lbl">Reps</span>${stepper("grmin",g.repsLow,0,99,1)}<span class="rangeto">to</span>${stepper("grmax",g.repsHigh,0,99,1)}</div>
    <div class="gline"><span class="lbl">Target RPE</span>${stepper("grpe",g.rpe,1,10,0.5)}</div>
    <div class="field" style="margin-top:14px"><label>Load</label>
      <div class="opts" id="assistOpts">
        <button class="opt ${isAssisted(ex)?"":"on"}" onclick="pick(this,'assistOpts')" data-v="Standard">Standard</button>
        <button class="opt ${isAssisted(ex)?"on":""}" onclick="pick(this,'assistOpts')" data-v="Assisted">Assisted</button></div>
      <div class="muted" style="margin:6px 2px 0;font-size:13px">Assisted = the number you log is help (machine or band), so the plan takes it <b>off</b> as you get stronger.</div></div>
    <div class="field"><label>Notes (optional)</label>
      <textarea class="text" id="gnotes" placeholder="e.g. pause at chest, controlled tempo">${escapeHtml((g.notes)||ex.guide||"")}</textarea></div>
    <button class="btn" onclick="saveGuide('${exId}')">Save goal</button>
    ${(ex.goal||ex.guide)?`<button class="btn ghost" style="margin-top:6px" onclick="saveGuide('${exId}',true)">Clear goal</button>`:""}`);
}
function saveGuide(exId, clear){
  const ex=exById(exId); if(!ex) return;
  // load type belongs to the exercise, not the goal — it survives "Clear goal"
  const sel=selected("assistOpts");
  if(sel) ex.assisted = (sel==="Assisted");
  if(clear){ ex.goal=null; ex.guide=""; save(); closeModal(); render(); return; }
  const gv=id=>{ const el=document.getElementById(id); if(!el||el.value==="") return null; const v=parseFloat(el.value); return isNaN(v)?null:v; };
  const notes=(document.getElementById("gnotes").value||"").trim();
  const goal={ sets:gv("gsets"), repsLow:gv("grmin"), repsHigh:gv("grmax"), rpe:gv("grpe"), notes };
  const empty = goal.sets==null && goal.repsLow==null && goal.repsHigh==null && goal.rpe==null && !notes;
  ex.goal = empty ? null : goal;
  ex.guide = "";
  save(); closeModal(); render();
}

   2. that track also gives us the lock-screen Now Playing card — the live
      countdown, with the transport buttons wired to ±15s / skip;
   3. when rest ends we play a real alarm through the same element (audible

function wavURI(samples, rate){

  const beeps=[[0,880],[0.28,880],[0.56,1150],[1.1,880],[1.38,880],[1.66,1150]];
  beeps.forEach(([off,hz])=>{
    const start=Math.round((at+off)*rate), len=Math.round(0.22*rate);
    for(let i=0;i<len && start+i<s.length;i++){

  writeAlarm(s, rate, Math.max(1,sec));

    src.start(beepCtx.currentTime + Math.max(0, inSec));
    bellSrc=src; bellScheduled=true;
  }catch(e){ bellScheduled=false; }
}
function cancelBell(){
  try{ if(bellSrc){ bellSrc.stop(); bellSrc.disconnect(); } }catch(e){}
  bellSrc=null; bellScheduled=false;
}
function mkAudio(){
  const a=document.createElement("audio");
  a.setAttribute("playsinline",""); a.preload="auto";
  document.body.appendChild(a);
  return a;
}
function ensureRestAudio(){
  if(restAudio) return restAudio;
  restAudio=mkAudio();
  // the track runs out only after its alarm has rung — that's our cue to let go
  restAudio.addEventListener("ended",()=>{ if(audioMode==="silent"||audioMode==="alarm"){ audioMode=null; releaseAudio(); } });
  return restAudio;
}
function ensureAlarmAudio(){
  if(alarmAudio) return alarmAudio;
  alarmAudio=mkAudio();
  alarmAudio.addEventListener("ended",()=>{ if(audioMode==="alarm"){ audioMode=null; releaseAudio(); } });
  return alarmAudio;
}
/* iOS lets an element that is ALREADY playing carry on in the background; it will not
   reliably start a paused one. Priming it and parking it at 0 wasn't enough — at zero, on
   a locked phone, play() resolved and no sound came out.

   So the bell never stops. From the ✓ that starts the rest it loops silently at volume 0,
   and at zero we only rewind and turn it up — no new playback to start, nothing for iOS
   to refuse. */
function primeAlarm(){
  if(!soundOn()) return;
  try{
    const a=ensureAlarmAudio(), src=alarmWAV();
    if(a.src!==src){ a.src=src; a.load(); }
    a.loop=false;
    a.muted=true;                    // muted, NOT volume=0 — iOS ignores volume on media elements
    const done=()=>{ try{ a.pause(); a.currentTime=0; }catch(e){} a.dataset.primed="1"; };
    if(a.paused){
      const p=a.play();
      if(p && p.then) p.then(done).catch(()=>{ a.dataset.primed="0"; });
      else done();
    }
  }catch(e){}
}
function playSrc(src, loop){
  if(!soundOn() && src!==silentWAV()) return false;   // silent keep-alive is always allowed
  try{
    const a=ensureRestAudio();
    a.loop=!!loop; a.volume=1;
    // only rewind when reusing the same source — currentTime throws on a fresh, unloaded src
    if(a.src!==src) a.src=src;
    else { try{ a.currentTime=0; }catch(e){} }
    const p=a.play(); if(p&&p.catch) p.catch(()=>{});
    return true;
  }catch(e){ return false; }
}
function startKeepAlive(secLeft){
  if(!lockAudioOn()) return;      // lock audio off = we never take the session, music plays on
  audioSession(wantedSession());
  audioMode="silent";
  const sec=(secLeft==null && rest.running) ? (rest.endAt-Date.now())/1000 : secLeft;
  if(!soundOn()){
    // sound off: loop a silent tone purely to stop iOS freezing the timer. No bell, mixes
    // with music, but it keeps us alive so the notification/buzz actually fires on time.
    playSrc(silentWAV(), true);
  } else {
    // the countdown's own track, alarm baked in at the end
    playSrc(restTrackWAV(Math.max(1, Math.round(sec||S.restDefault||90))), false);
  }
  wireNowPlaying();
}
function stopKeepAlive(){
  if(audioMode==="alarm") return;       // let a firing alarm finish
  // the track is inside its own alarm — let it ring out, "ended" releases us
  if(audioMode==="silent" && restAudio && !restAudio.paused && rest.endAt && Date.now()>=rest.endAt-250){
    audioMode="alarm";
    clearTimeout(alarmTimer);
    alarmTimer=setTimeout(()=>{ audioMode=null; releaseAudio(); }, (ALARM_DUR*1000)+800);
    return;
  }
  audioMode=null;
  releaseAudio();
}
/* Hand the audio session back to whatever was playing before us. Pausing the element
   isn't enough on iOS: media that's still loaded — and a still-running AudioContext —
   keep the session held, so the podcast/playlist we interrupted never resumes and the
   lock-screen card stays ours. So tear the element down, drop the Now Playing handlers,
   and let the beep context go idle. */
function releaseAudio(){
  clearTimeout(alarmTimer); alarmTimer=null;
  [restAudio, alarmAudio].forEach(el=>{
    try{
      if(el){ el.pause(); el.loop=false; el.removeAttribute("src"); el.load(); el.remove(); }
    }catch(e){}
  });
  restAudio=null; alarmAudio=null;
  clearNowPlaying();
  audioSession("ambient");        // hand exclusivity back — this is the bit that lets music resume
  // give ding()'s scheduled beeps time to finish before letting the context go
  clearTimeout(ctxIdle);
  ctxIdle=setTimeout(()=>{
    ctxIdle=null;
    // close rather than suspend: a suspended context still holds a session open. Late enough
    // that a bell mid-ring isn't cut off in the process.
    try{ if(beepCtx && beepCtx.state!=="closed" && beepCtx.close) beepCtx.close(); }catch(e){}
    beepCtx=null;
  }, (BELL_DUR*1000)+800);
}
function playAlarm(){
  if(!soundOn()) return false;
  const a=alarmAudio;
  const note=(v)=>{ const x=loadDiag()||{}; x.alarm=v; saveDiag(x); };
  if(!a){ note("never primed"); return false; }
  audioMode="alarm";
  // ring through the mute switch — released again the moment the bell finishes
  if(ringOnSilentOn()) audioSession("playback");
  { const x=loadDiag()||{};
    // what we asked for AND what iOS actually gave us, plus whether the bell was still rolling
    x.alarmCat=(ringOnSilentOn()?"playback":wantedSession())
      + "→" + ((navigator.audioSession&&navigator.audioSession.type)||"n/a");
    x.bell=(a.paused?"was paused":"rolling")+" t="+(a.currentTime||0).toFixed(1)+" rs="+a.readyState;
    saveDiag(x); }
  const ctxLive = !!(beepCtx && beepCtx.state==="running");
  let ok = bellScheduled && ctxLive;          // the scheduled bell is sounding right now
  bellScheduled=false; bellSrc=null;          // it's playing; nothing left to cancel
  // ALSO nudge the element. If both land they're the same waveform starting together, and
  // if the scheduled one didn't survive being backgrounded this is what you hear.
  try{
    a.muted=false; a.loop=false;
    try{ a.currentTime=0; }catch(e){}
    const p=a.play();
    if(p && p.then) p.then(()=>{ ok=true; note(ctxLive?"scheduled + element":"element"); })
                     .catch(err=>{ note(ok?"scheduled":"blocked: "+(err&&err.name||err)); if(!ok) ding(); });
    else ok=true;
  }catch(e){ note(ok?"scheduled":"threw: "+e); }
  if(!ok){ audioMode=null; releaseAudio(); return false; }
  nowPlayingText("Rest over 💪", "Next set");
  // belt and braces: if "ended" never fires (backgrounded tab, dropped element) we
  // still have to let go of the audio session, or music stays paused forever
  clearTimeout(alarmTimer);
  alarmTimer=setTimeout(()=>{ if(audioMode==="alarm") audioMode=null; releaseAudio(); }, 4500);
  return true;
}

/* ---- lock-screen Now Playing card ---- */
function npArt(){
  if(wavCache.art) return wavCache.art;
  try{
    const c=document.createElement("canvas"); c.width=c.height=512;
    const x=c.getContext("2d");
    x.fillStyle="#0e0f13"; x.fillRect(0,0,512,512);
    x.fillStyle="#2f7bff"; x.fillRect(80,224,352,64);
    x.fillStyle="#f2f4f8"; x.fillRect(58,181,59,150); x.fillRect(395,181,59,150);
    return (wavCache.art=c.toDataURL("image/png"));
  }catch(e){ return (wavCache.art=""); }
}
function curExName(){
  try{
    if(!S.active) return curProfile().name;
    const en=S.active.entries.find(e=>e.exerciseId===restExId) || S.active.entries[0];
    const ex=en&&exById(en.exerciseId);
    return ex?exDisplay(ex):curProfile().name;
  }catch(e){ return "Workout"; }
}
function nowPlayingText(title, sub){
  if(!("mediaSession" in navigator)) return;
  try{
    const art=npArt();
    navigator.mediaSession.metadata=new MediaMetadata({
      title, artist:sub||curExName(), album:"H+A Workouts",
      artwork: art?[{src:art,sizes:"512x512",type:"image/png"}]:[]
    });
    navigator.mediaSession.playbackState="playing";
  }catch(e){}
}
function nowPlaying(left, total){
  if(!("mediaSession" in navigator) || audioMode!=="silent") return;
  if(left===npSec) return;               // metadata churns the card — once per second is plenty
  npSec=left;
  nowPlayingText("Rest — "+fmtClock(left));
  try{
    navigator.mediaSession.setPositionState({
      duration: total, position: Math.min(total, Math.max(0, total-left)), playbackRate: 1
    });
  }catch(e){}
}
function clearNowPlaying(){
  npSec=-1; npWired=false;
  if(!("mediaSession" in navigator)) return;
  try{ navigator.mediaSession.playbackState="none"; navigator.mediaSession.metadata=null; }catch(e){}
  // release the transport buttons too, so the lock screen goes back to the music app
  try{ ["play","pause","stop","nexttrack","previoustrack"]
        .forEach(k=>navigator.mediaSession.setActionHandler(k,null)); }catch(e){}
}
// lock-screen transport: play/pause = skip the rest, track skip = ±15s
function wireNowPlaying(){
  if(npWired || !("mediaSession" in navigator)) return;
  npWired=true;
  const set=(k,fn)=>{ try{ navigator.mediaSession.setActionHandler(k,fn); }catch(e){} };
  set("pause",()=>stopRest());
  set("stop",()=>stopRest());
  set("play",()=>{ if(rest.running) startKeepAlive(); });
  set("nexttrack",()=>adjustRest(15));
  set("previoustrack",()=>adjustRest(-15));
}

/* ---- notifications ---- */
async function initNotify(){
  if(!("serviceWorker" in navigator)) return null;
  try{ swReg = await navigator.serviceWorker.register("sw.js"); }catch(e){ swReg=null; }
  return swReg;
}
function notifyPerm(){ return ("Notification" in window) ? Notification.permission : "unsupported"; }
function notifyRestDone(bellPlaying){
  const d=loadDiag()||{};
  const why = !notifyOn() ? "turned off"
            : notifyPerm()!=="granted" ? "permission: "+notifyPerm()
            : !swReg ? "no service worker" : null;
  if(why){ d.notify=why; saveDiag(d); return; }
  try{
    swReg.showNotification("Rest over 💪", {
      body: curExName()+" — time for your next set.",
      tag:"rest-done", renotify:true,
      /* iOS won't let a banner carry our bell — it only has its own chime. Silencing the
         banner in favour of the bell left a locked phone making no sound at all, so the
         chime stays until the bell is confirmed audible on a real device. */
      silent: false,
      vibrate:buzzPat(), data:{ at:Date.now() }
    }).then(()=>{ const x=loadDiag()||{}; x.notify="sent"; saveDiag(x); })
      .catch(err=>{ const x=loadDiag()||{}; x.notify="rejected: "+err; saveDiag(x); });
    d.notify="requested"; saveDiag(d);
  }catch(e){ d.notify="threw: "+e; saveDiag(d); }
}
function clearRestNotifications(){
  if(!swReg || !swReg.getNotifications) return;
  swReg.getNotifications({tag:"rest-done"}).then(ns=>ns.forEach(n=>n.close())).catch(()=>{});
}
async function toggleNotify(){
  const perm=notifyPerm();
  if(perm==="unsupported" || !("serviceWorker" in navigator)){
    S.notifyRest=false; save(); restSettings(); return;
  }
  if(perm==="granted"){ S.notifyRest=!notifyOn(); save(); restSettings(); return; }
  if(perm==="denied"){ restSettings(); return; }   // only iOS Settings can undo this
  try{
    const res=await Notification.requestPermission();   // this call needs the tap that got us here
    if(res==="granted"){ S.notifyRest=true; save(); await initNotify(); }
  }catch(e){}
  restSettings();
}
function toggleRingOnSilent(){ S.ringOnSilent=!ringOnSilentOn(); save(); restSettings(); }
function toggleLockAudio(){
  S.lockAudio=!lockAudioOn(); save();
  if(rest.running){ if(lockAudioOn()) startKeepAlive(); else stopKeepAlive(); }
  restSettings();
}

// rest bar buttons
document.getElementById("restbar").addEventListener("click",(e)=>{
  const v=e.target.getAttribute("data-rest"); if(!v) return;
  if(v==="skip") stopRest();
  else if(v==="-15") adjustRest(-15);
  else if(v==="+15") adjustRest(15);
});

/* ============================================================
   PLATE CALCULATOR — what to hang on each side of the bar.
   Plates are unlimited (commercial-gym assumption); we load biggest-first,
   the way you actually load a bar. Every plate is a multiple of the smallest,
   so any loadable weight resolves exactly; loadable steps by 2× the smallest.
   ============================================================ */
const PLATE_KIT = {
  lb:{ bars:[45,35,25,15,0],
       plates:[{w:45,c:"#2f7bff"},{w:35,c:"#ffb020"},{w:25,c:"#27c281"},
               {w:10,c:"#a16bff"},{w:5,c:"#ff6b9d"},{w:2.5,c:"#8b93a5"}] },
  kg:{ bars:[20,15,10,7.5,0],
       plates:[{w:25,c:"#e5484d"},{w:20,c:"#2f7bff"},{w:15,c:"#ffb020"},
               {w:10,c:"#27c281"},{w:5,c:"#a16bff"},{w:2.5,c:"#ff6b9d"},{w:1.25,c:"#8b93a5"}] }
};
const PLATE_H=[54,48,43,38,33,28,24];   // visual height per plate size, biggest first
let pcalc={weight:null, bar:45};

function plateKit(){ return PLATE_KIT[S.units==="kg"?"kg":"lb"]; }
function plateStep(){ const p=plateKit().plates; return p[p.length-1].w*2; }
function barDefault(){ const bars=plateKit().bars; return bars.includes(S.barWeight)?S.barWeight:bars[0]; }
function tidy(n){ return Math.round(n*100)/100; }

/* what's already on the bar for this exercise: your last typed working weight,
   else the recommendation the grey ghost is showing you */
function plateSeed(ei){
  const en=S.active&&S.active.entries[ei]; if(!en) return null;
  const ghosts=ghostsFor(en);
  let last=null;
  en.sets.forEach(st=>{ if(!st.warmup && st.weight!=null && st.weight!=="") last=st.weight; });
  if(last==null) en.sets.forEach(st=>{ if(st.weight!=null && st.weight!=="") last=st.weight; });
  if(last!=null){ const v=parseFloat(last); if(!isNaN(v)) return v; }
  for(let i=0;i<en.sets.length;i++){
    const g=ghosts[i]; if(!g||g.w==null||g.w==="") continue;
    const v=parseFloat(g.w); if(!isNaN(v)) return v;
  }
  return null;
}
/* greedy breakdown of ONE side */
function plateBreak(perSide){
  const out=[]; let left=tidy(perSide);
  plateKit().plates.forEach(p=>{
    const n=Math.floor((left+1e-6)/p.w);
    if(n>0){ out.push({w:p.w,c:p.c,n}); left=tidy(left-n*p.w); }
  });
  return out;
}
function plateCalc(ei){
  const seed=plateSeed(ei);
  pcalc={weight:seed, bar:barDefault()};
  const kit=plateKit(), u=S.units, step=plateStep();
  openModal(`<h3>Plate calculator</h3>
    <div class="pcw">
      <button onclick="plateBump(-${step})">−</button>
      <input id="pcw" inputmode="decimal" value="${seed!=null?seed:""}" placeholder="Total ${u}" oninput="plateType(this.value)">
      <button onclick="plateBump(${step})">+</button>
    </div>
    <div class="field"><label>Bar</label><div class="opts" id="pcbars">${
      kit.bars.map(b=>`<button class="opt ${b===pcalc.bar?'on':''}" data-b="${b}" onclick="plateBar(${b})">${b?b+" "+u:"No bar"}</button>`).join("")
    }</div></div>
    <div id="pcout"></div>`, true);
  plateRender();
}
function plateType(v){ const n=parseFloat(v); pcalc.weight=(v===""||isNaN(n))?null:n; plateRender(); }
function plateBump(d){
  const cur=(pcalc.weight!=null)?pcalc.weight:pcalc.bar;
  plateSetWeight(Math.max(0, tidy(cur+d)));
}
function plateSetWeight(v){
  pcalc.weight=v;
  const el=document.getElementById("pcw"); if(el) el.value=v;
  plateRender();
}
function plateBar(b){
  pcalc.bar=b; S.barWeight=b; save();   // device-only setting, not synced
  document.querySelectorAll("#pcbars .opt").forEach(o=>o.classList.toggle("on", parseFloat(o.dataset.b)===b));
  plateRender();
}
function plateRender(){
  const out=document.getElementById("pcout"); if(!out) return;
  const u=S.units, w=pcalc.weight, bar=pcalc.bar, step=plateStep();
  if(w==null){ out.innerHTML=`<div class="pcsub">Enter a total weight to see what goes on each side.</div>`; return; }
  if(w<bar-1e-6){
    out.innerHTML=`<div class="pcline warn">Lighter than the bar</div>
      <div class="pcsub">The bar alone is ${bar} ${u}. Pick a lighter bar, or use dumbbells.</div>`;
    return;
  }
  const target=bar+Math.floor((w-bar)/step+1e-6)*step;   // nearest loadable at or below
  const exact=Math.abs(target-w)<1e-6;
  const perSide=tidy((target-bar)/2);
  const list=plateBreak(perSide);
  const viz = list.length
    ? `<div class="pcbar"><span class="pcsleeve"></span>${
        list.map(p=>{
          const h=PLATE_H[plateKit().plates.findIndex(x=>x.w===p.w)]||24;
          return Array(p.n).fill(`<span class="pcplate" style="background:${p.c};height:${h}px">${p.w}</span>`).join("");
        }).join("")}</div>`
    : `<div class="pcbar"><span class="pcsleeve" style="width:64px"></span></div>`;
  const perTxt = list.length ? list.map(p=>p.n>1?`${p.w}×${p.n}`:`${p.w}`).join("  ·  ") : "—";
  out.innerHTML = `${exact?"":`<div class="pcline warn">${w} ${u} isn't loadable</div>
      <div class="pcsub">Closest are ${target} and ${tidy(target+step)} ${u}.
        <button class="opt" style="margin-top:8px" onclick="plateSetWeight(${target})">${target}</button>
        <button class="opt" style="margin-top:8px" onclick="plateSetWeight(${tidy(target+step)})">${tidy(target+step)}</button></div>`}
    ${viz}
    ${perSide===0
      ? `<div class="pcline">Just the bar — ${bar} ${u}</div>`
      : `<div class="pcline">${perSide} ${u} per side</div>
         <div class="pcsub">${escapeHtml(perTxt)}<br>${bar?`${bar} ${u} bar + `:""}2 × ${perSide} = <b>${target} ${u}</b></div>`}`;
}

/* ============================================================
   MODAL
   ============================================================ */
function openModal(inner, noScrollLock){
  closeModal();
  const o=document.createElement("div"); o.className="overlay";
  o.innerHTML=`<div class="sheet">${inner}</div>`;
  o.addEventListener("click",(e)=>{ if(e.target===o) closeModal(); });
  document.body.appendChild(o); modal=o;
}
function closeModal(){ if(modal){ modal.remove(); modal=null; } }

/* ============================================================
   misc
   ============================================================ */
function escapeHtml(s){ return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
document.getElementById("themeBtn").addEventListener("click",toggleTheme);

// keep the two phones on the same build (stale cached HTML broke joint sync before)
checkForUpdate();
setInterval(checkForUpdate, 5*60*1000);
document.addEventListener("visibilitychange",()=>{
  if(document.hidden) return;
  checkForUpdate();
  stopAlertRepeat();      // you're back — stop nagging
  clearRestNotifications();
  // if iOS suspended us anyway (lock-screen audio off), settle the clock on return
  if(rest.running) tickRest();
});
// the notification path needs a registered SW; harmless when permission was never asked for
initNotify();

// one-time cleanup of any legacy duplicate profiles
const _dp=dedupeProfiles(), _de=dedupeExercises();
if(_dp||_de) save();

// resume an active session timer after reload
if(S.active){ startSessionTimer(); }
render();
// show the "who's working out?" gate only until a profile is picked on this device
// (after that it goes straight in; tap the header title to switch later)
if(!S.active && !S.profilePicked){ openGate(); }

// expose for inline handlers
Object.assign(window,{go,switchProfile,addProfile,saveProfile,toggleTheme,openGate,enterAs,joinPartner,leaveTogether,startTogether,restSettings,setRestDefault,toggleNotify,toggleLockAudio,toggleRingOnSilent,applyUpdate,checkForUpdate,
  newTemplate,saveTemplate,openTemplate,renameWorkout,removeTemplateExercise,deleteWorkout,
  renameActive,saveActiveName,renameSession,saveSessionName,setPickMode,ssPickToggle,addSupersetSelection,
  startEmptyWorkout,startWorkout,openActive,openSession,addSet,removeSet,
  removeEntry,toggleDone,pickExercise,pickExerciseActive,pickExerciseForTemplate,onExType,pick,
  addExistingExercise,createAndAddExercise,finishWorkout,cancelWorkout,deleteSession,
  tplUpdate,tplSaveNewPrompt,tplSaveNew,tplDismiss,gotoSession,howTo,rpeHelp,editGuide,saveGuide,bump,closeModal,workoutById,save,render,
  plateCalc,plateType,plateBump,plateSetWeight,plateBar,
  exerciseOpts,ssLink,ssUnlink,tplExOpts,ssLinkTpl,ssUnlinkTpl,setRestSuperset,
  openExerciseProgress,exerciseSeries,trendOf,decomposeByExercise,consistency,confidenceOf,
  setBuzzPattern,testBuzz,buzzPattern,restBuzz,setAlertRepeat,alertRepeat,startAlertRepeat,stopAlertRepeat,
  setAlertMode,alertMode,soundOn,buzz,moveEntry,moveEntryUp,moveEntryDown,setPerSide,perSide});
</script>

<!-- ============================================================
     Firebase cloud sync (loads only if firebase-config.js is filled in).
     Uses the Firestore modular SDK from the official CDN. One shared
     document ("shared/data") holds both people's data.
     ============================================================ -->
<script type="module">
(async function(){
  const cfg = window.FIREBASE_CONFIG;
  if(!cfg || !cfg.apiKey){ return; }              // not configured yet → stay local-only
  try{
    const { initializeApp } = await import("https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js");
    const { getFirestore, doc, collection, onSnapshot, setDoc } =
      await import("https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js");
    const app = initializeApp(cfg);
    const db  = getFirestore(app);
    const ref = doc(db, "shared", "data");
    window.cloudPush = (data)=> setDoc(ref, data);  // full overwrite; merge happens on read
    onSnapshot(ref,
      (snap)=>{ if(snap.exists() && window.onCloudData) window.onCloudData(snap.data()); },
      (err)=>{ console.warn("sync error", err); if(window.setSyncErr) window.setSyncErr(); }
    );
    // LIVE LINK presence: one doc per profile, everyone watches the collection
    window.cloudPushPresence = (p)=> setDoc(doc(db, "presence", p.profileId), p);
    // (the joint exercise list travels inside each person's presence doc — no separate doc)
    onSnapshot(collection(db, "presence"),
      (snap)=>{ const list=[]; snap.forEach(d=>list.push(d.data())); if(window.onPresence) window.onPresence(list); },
      (err)=>{ console.warn("presence error", err); }
    );
    if(window.onCloudReady) window.onCloudReady();
  }catch(e){ console.warn("Firebase init failed", e); if(window.setSyncErr) window.setSyncErr(); }
})();
</script>
</body>
